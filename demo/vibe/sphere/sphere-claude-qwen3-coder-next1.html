<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Lava Sphere - Analog TV FX</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            background: radial-gradient(circle at center, #111 #000);
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Three.js Core -->
    <script src="https://unpkg.com/three@0.144.0/build/three.min.js"></script>

    <!-- OrbitControls -->
    <script src="https://unpkg.com/three@0.144.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Postprocessing -->
    <script src="https://unpkg.com/three@0.144.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.144.0/examples/js/postprocessing/RenderPass.js"></script>

    <!-- Shaders -->
    <script src="https://unpkg.com/three@0.144.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.144.0/examples/js/shaders/RGBShiftShader.js"></script>
    <script src="https://unpkg.com/three@0.144.0/examples/js/shaders/FilmShader.js"></script>
    <script src="https://unpkg.com/three@0.144.0/examples/js/shaders/LuminosityHighPassShader.js"></script>

    <!-- Postprocessing (depends on shaders) -->
    <script src="https://unpkg.com/three@0.144.0/examples/js/postprocessing/ShaderPass.js"></script>

    <!-- UnrealBloomPass depends on LuminosityHighPassShader -->
    <script src="https://unpkg.com/three@0.144.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <!-- lil-gui -->
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>

    <script>
        // --- Configuration & State ---
        const params = {
            // Noise parameters
            noiseAmplitude: 0.3,
            noiseScale: 1.5,
            noiseSpeed: 0.5,
            // Bloom parameters
            bloomStrength: 0.6,
            bloomRadius: 0.4,
            bloomThreshold: 0.1,
            // RGB shift
            rgbShiftAmount: 0.008,
            // Film / CRT parameters
            filmNoiseIntensity: 0.15,
            filmScanlineIntensity: 0.35,
            // Misc
            autoRotate: true,
            autoRotateSpeed: 0.2,
            // Toggle GUI visibility
            toggle: function() {
                guiHidden = !guiHidden;
                if (gui) {
                    gui.domElement.style.display = guiHidden ? 'none' : 'block';
                }
            }
        };

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- Orbit Controls ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 20;

        // --- Custom Shader Material for Lava-Lamp Effect ---
        const vertexShader = `
            uniform float uTime;
            uniform float uAmplitude;
            uniform float uScale;
            uniform float uSpeed;

            varying vec2 vUv;
            varying vec3 vNormal;

            // Simplex noise implementation
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) {
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);

                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );

                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;

                i = mod289(i);
                vec4 p = permute( permute( permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));

                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;

                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );

                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);

                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );

                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));

                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;

                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);

                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;

                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;

                return 2.2 * dot(m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ));
            }

            void main() {
                vUv = uv;
                vNormal = normalize(normalMatrix * normal);

                // Displace vertices using noise
                float noise = snoise(vec3(position.x * uScale, position.y * uScale, position.z * uScale + uTime * uSpeed));
                vec3 displacedPosition = position + normal * (noise * uAmplitude);

                gl_Position = projectionMatrix * modelViewMatrix * vec4(displacedPosition, 1.0);
            }
        `;

        const fragmentShader = `
            uniform vec3 uColor;

            varying vec2 vUv;
            varying vec3 vNormal;

            void main() {
                // Soft wireframe effect using fwidth
                vec3 d = fwidth(vNormal);
                float a = smoothstep(0.98, 1.0, dot(vNormal, normalize(vNormal)));

                // Create grid lines using fract
                float gridX = step(0.95, fract(vUv.x * 20.0));
                float gridY = step(0.95, fract(vUv.y * 20.0));
                float line = 1.0 - smoothstep(0.0, 0.2, gridX + gridY);

                // Combine with soft edges
                float intensity = smoothstep(0.8, 1.0, dot(vNormal, vec3(0.0, 0.0, 1.0)));
                float alpha = max(line, a) * 0.8 + intensity * 0.2;

                gl_FragColor = vec4(1.0, 0.95, 0.85, alpha);
            }
        `;

        // Create sphere geometry
        const geometry = new THREE.SphereGeometry(2.5, 64, 64);

        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uAmplitude: { value: params.noiseAmplitude },
                uScale: { value: params.noiseScale },
                uSpeed: { value: params.noiseSpeed },
                uColor: { value: new THREE.Color(0xffffff) }
            },
            vertexShader: vertexShader,
            fragmentShader: fragmentShader
        });

        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Add wireframe overlay for grid lines
        const wireframeGeometry = new THREE.WireframeGeometry(geometry);
        const wireframeMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 1 });
        const wireframe = new THREE.LineSegments(wireframeGeometry, wireframeMaterial);
        wireframe.visible = false; // Using shader-based wireframe instead
        scene.add(wireframe);

        // --- Postprocessing Pipeline ---
        const composer = new THREE.EffectComposer(renderer);

        // RenderPass
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // UnrealBloomPass
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.4, 0.85);
        bloomPass.strength = params.bloomStrength;
        bloomPass.radius = params.bloomRadius;
        bloomPass.threshold = params.bloomThreshold;
        composer.addPass(bloomPass);

        // RGBShiftPass
        const rgbShiftPass = new THREE.ShaderPass(THREE.RGBShiftShader);
        rgbShiftPass.uniforms['amount'].value = params.rgbShiftAmount;
        composer.addPass(rgbShiftPass);

        // FilmPass (CRT/Analog TV effect)
        const filmPass = new THREE.ShaderPass(THREE.FilmShader);
        filmPass.uniforms['nIntensity'].value = params.filmNoiseIntensity;
        filmPass.uniforms['sIntensity'].value = params.filmScanlineIntensity;
        filmPass.uniforms['sCount'].value = 1024;
        filmPass.uniforms['grayscale'].value = false;
        composer.addPass(filmPass);

        // --- Debug GUI ---
        let gui;
        let guiHidden = true;

        function initGUI() {
            if (gui) gui.destroy();

            gui = new lil.GUI({ title: 'Settings', autoPlace: false, container: document.body });
            gui.domElement.style.position = 'absolute';
            gui.domElement.style.top = '10px';
            gui.domElement.style.right = '10px';
            gui.domElement.style.zIndex = '100';
            gui.domElement.style.display = 'none';

            // Noise section
            const noiseFolder = gui.addFolder('Noise / Lava Effect');
            noiseFolder.add(params, 'noiseAmplitude', 0.0, 1.0).name('Amplitude').onChange(v => {
                material.uniforms.uAmplitude.value = v;
            });
            noiseFolder.add(params, 'noiseScale', 0.1, 5.0).name('Scale').onChange(v => {
                material.uniforms.uScale.value = v;
            });
            noiseFolder.add(params, 'noiseSpeed', 0.0, 5.0).name('Speed').onChange(v => {
                material.uniforms.uSpeed.value = v;
            });

            // Bloom section
            const bloomFolder = gui.addFolder('Bloom');
            bloomFolder.add(params, 'bloomStrength', 0.0, 2.0).name('Strength').onChange(v => {
                bloomPass.strength = v;
            });
            bloomFolder.add(params, 'bloomRadius', 0.0, 1.0).name('Radius').onChange(v => {
                bloomPass.radius = v;
            });
            bloomFolder.add(params, 'bloomThreshold', 0.0, 1.0).name('Threshold').onChange(v => {
                bloomPass.threshold = v;
            });

            // RGB Shift section
            const rgbFolder = gui.addFolder('RGB Shift');
            rgbFolder.add(params, 'rgbShiftAmount', 0.0, 0.05).name('Amount').onChange(v => {
                rgbShiftPass.uniforms['amount'].value = v;
            });

            // Film section
            const filmFolder = gui.addFolder('Film / CRT');
            filmFolder.add(params, 'filmNoiseIntensity', 0.0, 1.0).name('Noise').onChange(v => {
                filmPass.uniforms['nIntensity'].value = v;
            });
            filmFolder.add(params, 'filmScanlineIntensity', 0.0, 1.0).name('Scanlines').onChange(v => {
                filmPass.uniforms['sIntensity'].value = v;
            });

            // Misc section
            const miscFolder = gui.addFolder('Misc');
            miscFolder.add(params, 'autoRotate').name('Auto-Rotate');
            miscFolder.add(params, 'autoRotateSpeed', 0.0, 2.0).name('Rotation Speed').onChange(v => {
                // Update stored speed, applied in animation loop
            });

        }

        initGUI();

        // Toggle GUI with 'd' key
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'd') {
                params.toggle();
            }
        });

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            composer.reset();
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            // Update shader time uniform
            material.uniforms.uTime.value = elapsedTime;

            // Auto-rotation
            if (params.autoRotate) {
                sphere.rotation.y += params.autoRotateSpeed * delta;
                sphere.rotation.z += params.autoRotateSpeed * 0.5 * delta;
            }

            // Update controls
            controls.update();

            // Render
            composer.render(delta);
        }

        // Start animation
        animate();
    </script>
</body>
</html>
