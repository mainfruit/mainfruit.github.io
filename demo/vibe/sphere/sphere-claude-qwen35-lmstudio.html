<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Wireframe Sphere - Analog TV Aesthetic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .gui-hidden {
            display: none !important;
        }
        #instruction {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #444;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="instruction">Press 'd' to toggle controls</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/RGBShiftShader.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FilmShader.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>

     <script>
        const CONFIG = {
            sphereRadius: 2,
            sphereSegments: 128,
            noiseAmplitude: 0.35,
            noiseScale: 1.5,
            noiseSpeed: 0.4,
            bloomStrength: 1.5,
            bloomRadius: 0.4,
            bloomThreshold: 0.9,
            autoRotate: true,
            autoRotateSpeed: 0.2
         };

         const scene = new THREE.Scene();
         scene.background = new THREE.Color(0x050505);

         const camera = new THREE.PerspectiveCamera(
             50,
            window.innerWidth / window.innerHeight,
             0.1,
             100
          );
         camera.position.z = 6;

         const renderer = new THREE.WebGLRenderer({ antialias: false });
         renderer.setSize(window.innerWidth, window.innerHeight);
         renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
         document.body.appendChild(renderer.domElement);

         const controls = new THREE.OrbitControls(camera, renderer.domElement);
         controls.enableDamping = true;
         controls.dampingFactor = 0.05;
         controls.enableZoom = true;
         controls.enablePan = true;
         controls.enableRotate = true;
         controls.autoRotate = false;

         const vertexShader = `
            uniform float time;
            uniform float amplitude;
            uniform float noiseScale;

            vec3 mod289(vec3 x) {
                return x - floor(x * (1.0/289.0)) * 289.0;
             }

            vec4 mod289(vec4 x) {
                return x - floor(x * (1.0/289.0)) * 289.0;
             }

            vec4 permute(vec4 x) {
                return mod289(((x*34.0)+1.0)*x);
             }

            vec4 taylorInvSqrt(vec4 r) {
                return 1.79284291400159 - 0.85373472095314 * r;
             }

            float snoise(vec3 v) {
                const vec2  C = vec2(1.0/6.0, 1.0/3.0);
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);

                vec3 i = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);

                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);

                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;

                i = mod289(i);
                vec4 p = permute(permute(permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0))
                              + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                              + i.x + vec4(0.0, i1.x, i2.x, 1.0));

                float n_ = 1.0/7.0;
                vec3  ns = n_ * D.wyz - D.xzx;

                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);

                vec4 x = x_ * ns.x + ns.yyyy;
                vec4 y = y_ * ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);

                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);

                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));

                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;

                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);

                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;

                return 2.0 * clamp(dot(p0, x0) + dot(p1, x1) + dot(p2, x2) + dot(p3, x3), -1.0, 1.0);
             }

            varying float vNoise;
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                vec3 noiseCoord = vec3(
                    position.x * noiseScale,
                    position.y * noiseScale,
                    position.z * noiseScale + time * 0.5
                 );

                float n = snoise(noiseCoord) * 0.5 + 0.5;
                vec3 displacedPosition = position + normal * n * amplitude;

                vNoise = n;
                vNormal = normal;
                vPosition = position;

                gl_Position = projectionMatrix * modelViewMatrix * vec4(displacedPosition, 1.0);
                gl_PointSize = 1.0;
             }
         `;

         const fragmentShader = `
            varying float vNoise;
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                float intensity = 0.3 + vNoise * 0.7;
                vec3 color = vec3(0.8, 0.85, 0.9) * intensity;

                float dist = length(vPosition.xy);
                float vignette = 1.0 - dist * 0.1;
                color *= clamp(vignette, 0.5, 1.0);

                gl_FragColor = vec4(color, 1.0);
             }
         `;

         const geometry = new THREE.IcosahedronGeometry(
             CONFIG.sphereRadius,
             CONFIG.sphereSegments
          );

         const material = new THREE.ShaderMaterial({
             vertexShader: vertexShader,
             fragmentShader: fragmentShader,
             uniforms: {
                 time: { value: 0 },
                 amplitude: { value: CONFIG.noiseAmplitude },
                 noiseScale: { value: CONFIG.noiseScale }
              },
             wireframe: true
          });

         const sphere = new THREE.Mesh(geometry, material);
         scene.add(sphere);

         const composer = new THREE.EffectComposer(renderer);
         const renderPass = new THREE.RenderPass(scene, camera);
         composer.addPass(renderPass);

         const bloomPass = new THREE.UnrealBloomPass(
             new THREE.Vector2(window.innerWidth, window.innerHeight),
             CONFIG.bloomStrength,
             CONFIG.bloomRadius,
             CONFIG.bloomThreshold
          );

         const rgbShiftShader = {
             uniforms: {
                 tDiffuse: { value: null },
                 amount: { value: 0.002 }
              },
             vertexShader: `
                 varying vec2 vUv;
                 void main() {
                     vUv = uv;
                     gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                  }
              `,
             fragmentShader: `
                 uniform sampler2D tDiffuse;
                 uniform float amount;
                 varying vec2 vUv;

                 void main() {
                     vec2 red = vUv + vec2(amount, 0.0);
                     vec2 green = vUv;
                     vec2 blue = vUv - vec2(amount, 0.0);

                     vec4 r = texture2D(tDiffuse, red);
                     vec4 g = texture2D(tDiffuse, green);
                     vec4 b = texture2D(tDiffuse, blue);

                     gl_FragColor = vec4(r.rgb + g.rgb + b.rgb, 1.0);
                  }
              `
          };

         const rgbShiftPass = new THREE.ShaderPass(rgbShiftShader);

         const filmPass = new THREE.ShaderPass(THREE.FilmShader);

         composer.addPass(bloomPass);
         composer.addPass(rgbShiftPass);
         composer.addPass(filmPass);

         let guiVisible = false;
         const gui = new lil.GUI({
             title: 'Controls',
             width: 320
          });

         const sphereFolder = gui.addFolder('Sphere & Noise');
         sphereFolder.add(CONFIG, 'noiseAmplitude', 0, 0.8).name('Amplitude');
         sphereFolder.add(CONFIG, 'noiseScale', 0.5, 3.0).name('Scale');
         sphereFolder.add(CONFIG, 'noiseSpeed', 0, 2.0).name('Animation Speed');

         const postFxFolder = gui.addFolder('Post FX');
         postFxFolder.add(CONFIG, 'bloomStrength', 0, 3).name('Bloom Strength').onChange(v => {
             bloomPass.strength = v;
          });
         postFxFolder.add(CONFIG, 'bloomRadius', 0, 1).name('Bloom Radius').onChange(v => {
             bloomPass.radius = v;
          });
         postFxFolder.add(CONFIG, 'bloomThreshold', 0, 1).name('Threshold').onChange(v => {
             bloomPass.threshold = v;
          });

         const rgbShiftObj = { amount: 0.002 };
         postFxFolder.add(rgbShiftObj, 'amount', 0, 0.02).name('RGB Shift').onChange(v => {
             rgbShiftShader.uniforms.amount.value = v;
          });

         const filmNoiseObj = { intensity: 0.35 };
         postFxFolder.add(filmNoiseObj, 'intensity', 0, 1).name('Noise Intensity').onChange(v => {
             filmPass.uniforms.nIntensity.value = v;
          });

         const filmScanlineObj = { intensity: 0.3 };
         postFxFolder.add(filmScanlineObj, 'intensity', 0, 1).name('Scanlines').onChange(v => {
             filmPass.uniforms.sIntensity.value = v;
          });

         const miscFolder = gui.addFolder('Misc');
         miscFolder.add(CONFIG, 'autoRotate').name('Auto Rotate').onChange(value => {
             controls.autoRotate = value;
          });
         miscFolder.add(CONFIG, 'autoRotateSpeed', 0, 1).name('Rotation Speed');

         gui.domElement.classList.add('gui-hidden');

         document.addEventListener('keydown', (e) => {
             if (e.key === 'd' || e.key === 'D') {
                 guiVisible = !guiVisible;
                 if (guiVisible) {
                     gui.domElement.classList.remove('gui-hidden');
                  } else {
                     gui.domElement.classList.add('gui-hidden');
                  }
              }
          });

         window.addEventListener('resize', () => {
             camera.aspect = window.innerWidth / window.innerHeight;
             camera.updateProjectionMatrix();

             renderer.setSize(window.innerWidth, window.innerHeight);
             renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

             composer.setSize(window.innerWidth, window.innerHeight);
          });

         const clock = new THREE.Clock();

         function animate() {
             requestAnimationFrame(animate);

             const deltaTime = clock.getDelta();
             const elapsedTime = clock.getElapsedTime();

             material.uniforms.time.value = elapsedTime * CONFIG.noiseSpeed;

             controls.update(deltaTime);

             composer.render();
          }

         animate();
     </script>
</body>
</html>
