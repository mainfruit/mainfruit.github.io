<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Lava Grid Sphere - Analog TV</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
        #canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';

        // --- Configuration ---
        const params = {
            gridSize: 5.0,
            lavaSpeed: 0.5,
            lavaStrength: 0.15,
            rgbDistort: 0.015,
            blurFluff: 6.0,
            rotation: 0.2
        };

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 2.5;

        const canvas = document.getElementById('canvas');
        
        // --- Antialias disabled for raw pixel feel ---
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;

        // --- Shaders ---

        const vertexShader = `
            varying vec3 vPos;
            uniform float uTime;
            uniform float uStrength;

            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vPos = position;
                float noise = snoise(position + uTime);
                vec3 newPos = position + normal * noise * uStrength;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
            }
        `;

        const fragmentShader = `
            varying vec3 vPos;
            uniform float uGrid;
            void main() {
                vec3 grid = abs(fract(vPos * uGrid - 0.5) - 0.5);
                float line = step(0.02, min(grid.x, min(grid.y, grid.z)));
                if (line > 0.5) discard;
                gl_FragColor = vec4(1.0, 1.0, 1.0, 1.0);
            }
        `;

        const postVertexShader = `
            varying vec2 vUv;
            void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
        `;

        const postFragmentShader = `
            varying vec2 vUv;
            uniform sampler2D tDiffuse;
            uniform float uDistort;
            uniform float uBlur;
            uniform vec2 uRes;
            uniform float uTime;

            void main() {
                vec2 uv = vUv;
                
                // --- High-Radius "Fluffy" Blur ---
                vec3 blur = vec3(0.0);
                if (uBlur > 0.0) {
                    float spread = uBlur / uRes.x;
                    // Jittered multi-sample pattern for soft fluff
                    blur += texture2D(tDiffuse, uv + vec2(-spread, -spread)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(0.0, -spread * 1.5)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(spread, -spread)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(-spread * 1.5, 0.0)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(0.0, 0.0)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(spread * 1.5, 0.0)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(-spread, spread)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(0.0, spread * 1.5)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(spread, spread)).rgb;
                    
                    // Outer taps for extra halo fluff
                    blur += texture2D(tDiffuse, uv + vec2(spread * 2.0, spread * 2.0)).rgb * 0.5;
                    blur += texture2D(tDiffuse, uv + vec2(-spread * 2.0, -spread * 2.0)).rgb * 0.5;
                    blur += texture2D(tDiffuse, uv + vec2(spread * 2.0, -spread * 2.0)).rgb * 0.5;
                    blur += texture2D(tDiffuse, uv + vec2(-spread * 2.0, spread * 2.0)).rgb * 0.5;
                    
                    blur /= 11.0;
                } else {
                    blur = texture2D(tDiffuse, uv).rgb;
                }

                // Chromatic Aberration
                float r = texture2D(tDiffuse, uv + vec2(uDistort, 0.0)).r;
                float b = texture2D(tDiffuse, uv - vec2(uDistort, 0.0)).b;
                vec3 color = vec3(r, blur.g, b);

                // Analog Scanlines & Vignette
                float scanline = sin(uv.y * uRes.y * 1.5 + uTime * 5.0) * 0.05;
                float vignette = 1.0 - length(uv - 0.5) * 1.1;
                
                gl_FragColor = vec4((color - scanline) * vignette, 1.0);
            }
        `;

        // --- Construction ---
        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(1, 128, 128),
            new THREE.ShaderMaterial({
                vertexShader, fragmentShader,
                uniforms: { 
                    uTime: { value: 0 }, 
                    uGrid: { value: params.gridSize }, 
                    uStrength: { value: params.lavaStrength } 
                },
                side: THREE.DoubleSide
            })
        );
        scene.add(sphere);

        const renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);
        const postScene = new THREE.Scene();
        const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const postQuad = new THREE.Mesh(
            new THREE.PlaneGeometry(2, 2),
            new THREE.ShaderMaterial({
                vertexShader: postVertexShader,
                fragmentShader: postFragmentShader,
                uniforms: {
                    tDiffuse: { value: null },
                    uDistort: { value: params.rgbDistort },
                    uBlur: { value: params.blurFluff },
                    uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uTime: { value: 0 }
                }
            })
        );
        postScene.add(postQuad);

        // --- UI ---
        const gui = new GUI();
        gui.add(params, 'gridSize', 1, 15, 0.1).name('Grid Scale').onChange(v => sphere.material.uniforms.uGrid.value = v);
        gui.add(params, 'lavaStrength', 0, 0.5).name('Lava Motion').onChange(v => sphere.material.uniforms.uStrength.value = v);
        gui.add(params, 'rgbDistort', 0, 0.05).name('RGB Distort').onChange(v => postQuad.material.uniforms.uDistort.value = v);
        gui.add(params, 'blurFluff', 0, 30).name('Blur Fluff').onChange(v => postQuad.material.uniforms.uBlur.value = v);
        gui.add(params, 'rotation', 0, 1).name('Rotation');

        window.addEventListener('resize', () => {
            const w = window.innerWidth, h = window.innerHeight;
            camera.aspect = w / h; camera.updateProjectionMatrix();
            renderer.setSize(w, h); renderTarget.setSize(w, h);
            postQuad.material.uniforms.uRes.value.set(w, h);
        });

        function animate(time) {
            requestAnimationFrame(animate);
            const t = time * 0.001;
            controls.update();
            sphere.rotation.y += params.rotation * 0.01;
            sphere.material.uniforms.uTime.value = t * params.lavaSpeed;
            postQuad.material.uniforms.uTime.value = t;

            renderer.setRenderTarget(renderTarget);
            renderer.render(scene, camera);
            renderer.setRenderTarget(null);

            postQuad.material.uniforms.tDiffuse.value = renderTarget.texture;
            renderer.render(postScene, postCamera);
        }
        animate(0);
    </script>
</body>
</html>
