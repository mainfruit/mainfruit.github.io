<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Sphere Artwork</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #debug-ui {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
        }
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #666;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="debug-ui"></div>
    <div id="instructions">Drag to rotate | Scroll to zoom | Press "d" to toggle debug UI</div>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';
        import lilGui from 'three/addons/libs/lil-gui.module.min.js';

        // ============================================
        // CONFIGURATION
        // ============================================
        const config = {
            sphere: {
                radius: 5,
                latitudeSegments: 24,
                longitudeSegments: 36,
                rectangleWidth: 0.15,
                rectangleHeight: 0.15,
                gap: 0.05,
                displacement: 0.3
            },
            animation: {
                amplitude: 0.5,
                frequency: 0.001,
                speed: 1,
                noiseScale: 0.5,
                coherence: 0.8,
                autoRotate: true,
                autoRotateSpeed: 0.001
            },
            postProcessing: {
                enabled: true,
                rgbShift: 0.002,
                blur: 1.5,
                gloss: 1.2,
                vignette: 0.5,
                scanline: 0.1,
                noise: 0.05,
                effectMix: 1
            },
            camera: {
                fov: 45,
                distance: 18,
                pixelRatioCap: 2
            }
        };

        // ============================================
        // STATE
        // ============================================
        let scene, camera, renderer, controls, composer;
        let rectangleGroup, noiseData;
        let originalPositions, animatedPositions;
        let time = 0;
        let guiVisible = true;

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // Camera
            camera = new THREE.PerspectiveCamera(
                config.camera.fov,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.z = config.camera.distance;

            // Renderer
            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('canvas'),
                antialias: false,
                powerPreference: 'high-performance'
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, config.camera.pixelRatioCap));
            renderer.setSize(window.innerWidth, window.innerHeight);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.minDistance = 8;
            controls.maxDistance = 40;

            // Create sphere rectangles
            createSphereRectangles();

            // Setup post-processing
            setupPostProcessing();

            // Setup GUI
            setupGUI();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);

            // Start animation
            animate();
        }

        // ============================================
        // SPHERE RECTANGLES
        // ============================================
        function createSphereRectangles() {
                // Dispose old group and all children first
            if (rectangleGroup) {
                rectangleGroup.traverse(child => {
                    if (child.isMesh) {
                        child.geometry.dispose();
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                });
                scene.remove(rectangleGroup);
            }

            rectangleGroup = new THREE.Group();
            scene.add(rectangleGroup);

            const geoConfig = new THREE.SphereGeometry(
                config.sphere.radius,
                config.sphere.latitudeSegments,
                config.sphere.longitudeSegments
            );

            const posAttribute = geoConfig.attributes.position;
            const normalsAttribute = geoConfig.attributes.normal;
            const count = posAttribute.count;

            originalPositions = new Float32Array(count * 3);
            animatedPositions = new Float32Array(count * 3);
            noiseData = new Float32Array(count);

            // Copy original positions and calculate sphere positions
            for (let i = 0; i < count; i++) {
                const x = posAttribute.getX(i);
                const y = posAttribute.getY(i);
                const z = posAttribute.getZ(i);

                // Store original
                originalPositions[i * 3] = x;
                originalPositions[i * 3 + 1] = y;
                originalPositions[i * 3 + 2] = z;

                // Store animated (same as original initially)
                animatedPositions[i * 3] = x;
                animatedPositions[i * 3 + 1] = y;
                animatedPositions[i * 3 + 2] = z;

                // Generate noise value for this vertex
                noiseData[i] = Math.random();
            }

            // Create rectangles (scale rect size with sphere radius for consistent appearance)
            const rectWidth = config.sphere.rectangleWidth * config.sphere.radius * 0.3;
            const rectHeight = config.sphere.rectangleHeight * config.sphere.radius * 0.3;
            const rectGeometry = new THREE.PlaneGeometry(rectWidth, rectHeight);
            const rectMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                side: THREE.DoubleSide
            });

            for (let i = 0; i < count; i++) {
                const mesh = new THREE.Mesh(rectGeometry, rectMaterial.clone());

                // Position on sphere
                const x = animatedPositions[i * 3];
                const y = animatedPositions[i * 3 + 1];
                const z = animatedPositions[i * 3 + 2];
                mesh.position.set(x, y, z);

                // Orient to follow sphere curvature (face outward)
                mesh.lookAt(0, 0, 0);
                mesh.rotateX(Math.PI / 2);

                // Add gap offset
                mesh.position.multiplyScalar(1 + config.sphere.gap / config.sphere.radius);


                // Store initial rotation quaternion for reuse
                mesh.userData.initialQuaternion = mesh.quaternion.clone();
                mesh.userData.noiseIndex = i;
                rectangleGroup.add(mesh);
            }
        }

        // ============================================
        // POST-PROCESSING
        // ============================================
        function setupPostProcessing() {
            composer = new EffectComposer(renderer);

            // Render pass
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            // RGB Shift
            const rgbShiftPass = new ShaderPass(RGBShiftShader);
            rgbShiftPass.uniforms['amount'].value = config.postProcessing.rgbShift;
            rgbShiftPass.uniforms['angle'].value = 0;
            rgbShiftPass.enabled = config.postProcessing.enabled;
            composer.addPass(rgbShiftPass);

            // Bloom (gloss)
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                config.postProcessing.gloss,
                1,
                0
            );
            bloomPass.enabled = config.postProcessing.enabled;
            composer.addPass(bloomPass);

            // Blur
            const blurPass = new ShaderPass({
                uniforms: {
                    'tDiffuse': { value: null },
                    'resolution': { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                     'blurAmount': { value: config.postProcessing.blur }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform vec2 resolution;
                    uniform float blurAmount;
                    varying vec2 vUv;

                    void main() {
                        vec2 pixelSize = 1.0 / resolution;
                        vec4 color = vec4(0.0);
                        float total = 0.0;
                        int blurRadius = int(blurAmount * 4.0 + 0.5);

                        for (int x = -blurRadius; x <= blurRadius; x++) {
                            for (int y = -blurRadius; y <= blurRadius; y++) {
                                vec2 offset = vec2(float(x), float(y)) * pixelSize;
                                color += texture2D(tDiffuse, vUv + offset);
                                total++;
                            }
                        }
                        gl_FragColor = color / total;
                    }
                `
            });
            blurPass.enabled = config.postProcessing.enabled;
            composer.addPass(blurPass);

            // Vignette
            const vignettePass = new ShaderPass({
                uniforms: {
                    'tDiffuse': { value: null },
                    'darkness': { value: config.postProcessing.vignette }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float darkness;
                    varying vec2 vUv;

                    void main() {
                        vec4 color = texture2D(tDiffuse, vUv);
                        vec2 center = 0.5 - vUv;
                        float dist = length(center);
                        float vignette = 1.0 - dist * darkness * 2.0;
                        gl_FragColor = vec4(color.rgb * vignette, color.a);
                    }
                `
            });
            vignettePass.enabled = config.postProcessing.enabled;
            composer.addPass(vignettePass);

            // Scanlines
            const scanlinePass = new ShaderPass({
                uniforms: {
                    'tDiffuse': { value: null },
                    'scanlineStrength': { value: config.postProcessing.scanline },
                    'time': { value: 0 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float scanlineStrength;
                    uniform float time;
                    varying vec2 vUv;

                    void main() {
                        vec4 color = texture2D(tDiffuse, vUv);
                        float scanline = sin(vUv.y * 800.0 + time * 2.0) * 0.5 + 0.5;
                        scanline = 1.0 - scanline * scanlineStrength;
                        gl_FragColor = vec4(color.rgb * scanline, color.a);
                    }
                `
            });
            scanlinePass.enabled = config.postProcessing.enabled;
            composer.addPass(scanlinePass);

            // Noise
            const noisePass = new ShaderPass({
                uniforms: {
                    'tDiffuse': { value: null },
                    'noiseAmount': { value: config.postProcessing.noise },
                    'time': { value: 0 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float noiseAmount;
                    uniform float time;
                    varying vec2 vUv;

                    float random(vec2 p) {
                        return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
                    }

                    void main() {
                        vec4 color = texture2D(tDiffuse, vUv);
                        float noise = random(vUv + time) * 2.0 - 1.0;
                        color.rgb += noise * noiseAmount;
                        gl_FragColor = color;
                    }
                `
            });
            noisePass.enabled = config.postProcessing.enabled;
            composer.addPass(noisePass);
        }

        // ============================================
        // GUI
        // ============================================
        function setupGUI() {
            const gui = new lilGui({ container: document.getElementById('debug-ui') });

            const sphereFolder = gui.addFolder('Sphere Layout');
            sphereFolder.add(config.sphere, 'radius', 1, 10).name('Radius').onChange(v => {
                createSphereRectangles();
            });
            sphereFolder.add(config.sphere, 'rectangleWidth', 0.05, 0.5).name('Rect Width').onChange(v => {
                createSphereRectangles();
            });
            sphereFolder.add(config.sphere, 'rectangleHeight', 0.05, 0.5).name('Rect Height').onChange(v => {
                createSphereRectangles();
            });
            sphereFolder.add(config.sphere, 'gap', 0, 0.5).name('Gap').onChange(v => {
                createSphereRectangles();
            });
            sphereFolder.add(config.sphere, 'displacement', 0, 2).name('Shell Depth');

            const animationFolder = gui.addFolder('Animation');
            animationFolder.add(config.animation, 'amplitude', 0, 2).name('Amplitude');
            animationFolder.add(config.animation, 'frequency', 0, 0.01).name('Frequency');
            animationFolder.add(config.animation, 'speed', 0, 5).name('Speed');
            animationFolder.add(config.animation, 'noiseScale', 0.1, 2).name('Noise Scale');
            animationFolder.add(config.animation, 'coherence', 0, 1).name('Coherence');
            animationFolder.add(config.animation, 'autoRotate').name('Auto Rotate').onChange(v => {
                controls.enableRotate = v;
            });
            animationFolder.add(config.animation, 'autoRotateSpeed', 0, 0.01).name('Rotate Speed');

            const postFolder = gui.addFolder('Post Processing');
            postFolder.add(config.postProcessing, 'enabled').name('Enable Effects').onChange(v => {
                composer.passes.forEach(pass => pass.enabled = v);
            });
            postFolder.add(config.postProcessing, 'rgbShift', 0, 0.05).name('RGB Shift').onChange(v => {
                const rgbShiftPass = composer.passes.find(p => p.uniforms?.distortion);
                if (rgbShiftPass) rgbShiftPass.uniforms['distortion'].value = v;
            });
            postFolder.add(config.postProcessing, 'blur', 0, 5).name('Blur').onChange(v => {
                const blurPass = composer.passes.find(p => p.uniforms?.blurAmount);
                if (blurPass) blurPass.uniforms['blurAmount'].value = v;
            });
            postFolder.add(config.postProcessing, 'gloss', 0, 5).name('Gloss/Bloom').onChange(v => {
                const bloomPass = composer.passes.find(p => p instanceof UnrealBloomPass);
                if (bloomPass) bloomPass.intensity = v;
            });
            postFolder.add(config.postProcessing, 'vignette', 0, 1).name('Vignette').onChange(v => {
                const vignettePass = composer.passes.find(p => p.uniforms?.darkness);
                if (vignettePass) vignettePass.uniforms['darkness'].value = v;
            });
            postFolder.add(config.postProcessing, 'scanline', 0, 1).name('Scanline').onChange(v => {
                const scanlinePass = composer.passes.find(p => p.uniforms?.scanlineStrength);
                if (scanlinePass) scanlinePass.uniforms['scanlineStrength'].value = v;
            });
            postFolder.add(config.postProcessing, 'noise', 0, 0.5).name('Noise').onChange(v => {
                const noisePass = composer.passes.find(p => p.uniforms?.noiseAmount);
                if (noisePass) noisePass.uniforms['noiseAmount'].value = v;
            });
            postFolder.add(config.postProcessing, 'effectMix', 0, 1).name('Effect Mix');

            const cameraFolder = gui.addFolder('Camera');
            cameraFolder.add(config.camera, 'fov', 30, 120).name('FOV').onChange(v => {
                camera.fov = v;
                camera.updateProjectionMatrix();
            });
            cameraFolder.add(config.camera, 'distance', 8, 40).name('Distance').onChange(v => {
                camera.position.z = v;
            });
            cameraFolder.add(config.camera, 'pixelRatioCap', 1, 4).name('Pixel Ratio Cap').onChange(v => {
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, v));
            });

            gui.add({ reset: resetToDefaults }, 'reset').name('Reset to Defaults');

            gui.close();
        }

        function resetToDefaults() {
            Object.assign(config, {
                sphere: {
                    radius: 5,
                    latitudeSegments: 24,
                    longitudeSegments: 36,
                    rectangleWidth: 0.15,
                    rectangleHeight: 0.15,
                    gap: 0.05,
                    displacement: 0.3
                },
                animation: {
                    amplitude: 0.5,
                    frequency: 0.001,
                    speed: 1,
                    noiseScale: 0.5,
                    coherence: 0.8,
                    autoRotate: true,
                    autoRotateSpeed: 0.001
                },
                postProcessing: {
                    enabled: true,
                    rgbShift: 0.002,
                    blur: 1.5,
                    gloss: 1.2,
                    vignette: 0.5,
                    scanline: 0.1,
                    noise: 0.05,
                    effectMix: 1
                },
                camera: {
                    fov: 45,
                    distance: 18,
                    pixelRatioCap: 2
                }
            });
            createSphereRectangles();
            setupPostProcessing();
            setupGUI();
        }

        // ============================================
        // ANIMATION
        // ============================================
        function animate() {
            requestAnimationFrame(animate);

            time += 0.016 * config.animation.speed;

            // Animate rectangle positions
            if (rectangleGroup) {
                const children = rectangleGroup.children;
                for (let i = 0; i < children.length; i++) {
                    const mesh = children[i];
                    const idx = mesh.userData.noiseIndex;
                    const ox = originalPositions[idx * 3];
                    const oy = originalPositions[idx * 3 + 1];
                    const oz = originalPositions[idx * 3 + 2];

                      // Perlin-like noise displacement
                    const noiseVal = noiseData[idx];
                    const displacement = (Math.sin(noiseVal * Math.PI * 2 + time * config.animation.coherence) + 1) / 2;
                    const offset = displacement * config.sphere.displacement * config.animation.amplitude;

                    const nx = ox + (ox * offset);
                    const ny = oy + (oy * offset);
                    const nz = oz + (oz * offset);

                    animatedPositions[idx * 3] = nx;
                    animatedPositions[idx * 3 + 1] = ny;
                    animatedPositions[idx * 3 + 2] = nz;

                    mesh.position.set(nx, ny, nz);
                    mesh.quaternion.copy(mesh.userData.initialQuaternion);
                }
            }

            // Auto rotation
            if (config.animation.autoRotate) {
                rectangleGroup.rotation.y += config.animation.autoRotateSpeed;
            }

            // Update shader uniforms
            composer.passes.forEach(pass => {
                if (pass.uniforms && pass.uniforms.time) {
                    pass.uniforms.time.value = time;
                }
            });

            controls.update();
            composer.render();
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function onKeyDown(event) {
            if (event.key === 'd' || event.key === 'D') {
                guiVisible = !guiVisible;
                const guiElement = document.getElementById('debug-ui');
                guiElement.style.display = guiVisible ? 'block' : 'none';
            }
        }

        // ============================================
        // START
        // ============================================
        init();
    </script>
</body>
</html>
