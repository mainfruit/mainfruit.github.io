<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Lava Grid Sphere</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
        #canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';

        // --- Config ---
        const params = {
            gridDensity: 40,
            lavaSpeed: 0.6,
            lavaStrength: 0.15,
            rgbDistortion: 0.006,
            rotation: 0.2
        };

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 2.5;

        const canvas = document.getElementById('canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;

        // --- Shaders ---
        const vertexShader = `
            varying vec2 vUv;
            uniform float uTime;
            uniform float uStrength;

            // Simplex Noise
            vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
            float snoise(vec2 v){
                const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                vec2 i  = floor(v + dot(v, C.yy) );
                vec2 x0 = v -   i + dot(i, C.xx);
                vec2 i1;
                i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                vec4 x12 = x0.xyxy + C.xxzz;
                x12.xy -= i1;
                i = mod(i, 289.0);
                vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                m = m*m; m = m*m;
                vec3 x = 2.0 * fract(p * C.www) - 1.0;
                vec3 h = abs(x) - 0.5;
                vec3 ox = floor(x + 0.5);
                vec3 a0 = x - ox;
                m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                vec3 g;
                g.x  = a0.x  * x0.x  + h.x  * x0.y;
                g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                return 130.0 * dot(m, g);
            }

            void main() {
                vUv = uv;
                float noise = snoise(uv * 4.0 + uTime);
                vec3 pos = position + normal * noise * uStrength;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const fragmentShader = `
            varying vec2 vUv;
            uniform float uGrid;
            void main() {
                // Fixed-width grid lines
                vec2 grid = abs(fract(vUv * uGrid - 0.5) - 0.5);
                float line = step(0.02, min(grid.x, grid.y));
                if (line > 0.5) discard;
                gl_FragColor = vec4(1.0, 1.0, 1.0, 1.0);
            }
        `;

        const postVertexShader = `
            varying vec2 vUv;
            void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
        `;

        const postFragmentShader = `
            varying vec2 vUv;
            uniform sampler2D tDiffuse;
            uniform float uDistortion;
            uniform vec2 uRes;
            void main() {
                vec2 uv = vUv;
                // Chromatic Aberration
                float r = texture2D(tDiffuse, uv + vec2(uDistortion, 0.0)).r;
                float g = texture2D(tDiffuse, uv).g;
                float b = texture2D(tDiffuse, uv - vec2(uDistortion, 0.0)).b;
                vec3 color = vec3(r, g, b);
                
                // Vignette & Scanlines
                float vignette = 1.0 - length(uv - 0.5) * 0.8;
                float scanline = sin(uv.y * uRes.y * 1.5) * 0.04;
                gl_FragColor = vec4(color * vignette - scanline, 1.0);
            }
        `;

        // --- Build ---
        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(1, 128, 128),
            new THREE.ShaderMaterial({
                vertexShader, fragmentShader,
                uniforms: { 
                    uTime: { value: 0 }, 
                    uGrid: { value: params.gridDensity }, 
                    uStrength: { value: params.lavaStrength } 
                },
                side: THREE.DoubleSide
            })
        );
        scene.add(sphere);

        const renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);
        const postScene = new THREE.Scene();
        const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const postQuad = new THREE.Mesh(
            new THREE.PlaneGeometry(2, 2),
            new THREE.ShaderMaterial({
                vertexShader: postVertexShader,
                fragmentShader: postFragmentShader,
                uniforms: {
                    tDiffuse: { value: null },
                    uDistortion: { value: params.rgbDistortion },
                    uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
                }
            })
        );
        postScene.add(postQuad);

        // --- UI ---
        const gui = new GUI();
        gui.add(params, 'gridDensity', 10, 200, 1).name('Grid Density').onChange(v => sphere.material.uniforms.uGrid.value = v);
        gui.add(params, 'lavaStrength', 0, 0.5).name('Lava Motion').onChange(v => sphere.material.uniforms.uStrength.value = v);
        gui.add(params, 'lavaSpeed', 0, 2).name('Lava Speed');
        gui.add(params, 'rgbDistortion', 0, 0.05).name('RGB Distort').onChange(v => postQuad.material.uniforms.uDistortion.value = v);
        gui.add(params, 'rotation', 0, 1).name('Rotation');

        window.addEventListener('resize', () => {
            const w = window.innerWidth, h = window.innerHeight;
            camera.aspect = w / h; camera.updateProjectionMatrix();
            renderer.setSize(w, h); renderTarget.setSize(w, h);
            postQuad.material.uniforms.uRes.value.set(w, h);
        });

        function animate(time) {
            requestAnimationFrame(animate);
            const t = time * 0.001;
            controls.update();
            sphere.rotation.y += params.rotation * 0.01;
            sphere.material.uniforms.uTime.value = t * params.lavaSpeed;

            renderer.setRenderTarget(renderTarget);
            renderer.render(scene, camera);
            renderer.setRenderTarget(null);

            postQuad.material.uniforms.tDiffuse.value = renderTarget.texture;
            renderer.render(postScene, postCamera);
        }
        animate(0);
    </script>
</body>
</html>
