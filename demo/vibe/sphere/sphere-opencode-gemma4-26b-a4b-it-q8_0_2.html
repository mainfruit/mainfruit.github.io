<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lava Sphere Artwork</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<!-- Load lil-gui via UMD -->
<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/**
 * LAVA SPHERE ARTWORK
 * A single-file Three.js implementation of a noise-deformed wireframe sphere
 * with analog TV post-processing and a debug UI.
 */

// --- SHADER SOURCE ---

const vertexShader = `
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec2 vUv;
    uniform float uTime;
    uniform float uNoiseScale;
    uniform float uNoiseAmplitude;
    uniform float uNoiseSpeed;

    // Simplex 3D noise
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
    float snoise(vec3 v){ 
      const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
      const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i  = floor(v + dot(v, C.yyy) );
      vec3 x0 =   v - i + dot(i, C.xxx) ;
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min( g.xyz, l.zxy );
      vec3 i2 = max( g.xyz, l.zxy );
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod(i, 289.0 ); 
      vec4 p = permute( permute( permute( 
                 i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
               + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
               + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
      float n_ = 1.0/7.0;
      vec3  ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_ );
      vec4 x = x_ *ns.x + ns.yyyy;
      vec4 y = y_ *ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4( x.xy, y.xy );
      vec4 b1 = vec4( x.zw, y.zw );
      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
      vec3 p0 = vec3(a0.xy,h.x);
      vec3 p1 = vec3(a0.zw,h.y);
      vec3 p2 = vec3(a1.xy,h.z);
      vec3 p3 = vec3(a1.zw,h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
    }

    void main() {
        vNormal = normal;
        vUv = uv;
        
        // Calculate displacement using simplex noise
        float noise = snoise(position * uNoiseScale + (uTime * uNoiseSpeed));
        vec3 displacement = normal * noise * uNoiseAmplitude;
        
        vec3 newPosition = position + displacement;
        vPosition = newPosition;
        
        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
`;

const fragmentShader = `
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec2 vUv;
    uniform vec3 uColor;
    uniform float uGridScale;
    uniform float uLineWidth;

    void main() {
        vec2 gridUv = vUv * uGridScale;
        vec2 cellUv = fract(gridUv);
        
        // Distance to the nearest edge of the cell [0,1]
        float distToEdge = min(cellUv.x, min(cellUv.y, min(1.0 - cellUv.x, 1.0 - cellUv.y)));
        
        // Use fwidth for pixel-perfect anti-aliasing
        float delta = fwidth(distToEdge);
        
        // Thickness in pixels
        float mask = 1.0 - smoothstep(0.0, delta * uLineWidth, distToEdge);
        
        if (mask < 0.01) discard;

        gl_FragColor = vec4(uColor, mask);
    }
`;

// Custom RGB Shift Shader
const RGBShiftShaderCustom = {
    uniforms: {
        'tDiffuse': { value: null },
        'amount': { value: 0.003 }
    },
    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float amount;
        varying vec2 vUv;
        void main() {
            vec4 cr = texture2D(tDiffuse, vUv + vec2(amount, 0.0));
            vec4 cg = texture2D(tDiffuse, vUv);
            vec4 cb = texture2D(tDiffuse, vUv - vec2(amount, 0.0));
            gl_FragColor = vec4(cr.r, cg.g, cb.b, cg.a);
        }
    `
};

// Custom Analog TV Shader (Noise + Scanlines)
const AnalogTVShader = {
    uniforms: {
        'tDiffuse': { value: null },
        'time': { value: 0.0 },
        'noiseIntensity': { value: 0.5 },
        'scanlineIntensity': { value: 0.4 }
    },
    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float noiseIntensity;
        uniform float scanlineIntensity;
        varying vec2 vUv;

        float rand(vec2 co){
            return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
        }

        void main() {
            vec4 texel = texture2D(tDiffuse, vUv);
            
            // Noise
            float noise = (rand(vUv + time) - 0.5) * noiseIntensity;
            
            // Scanlines
            float scanline = sin(vUv.y * 600.0 + time * 2.0) * 0.5 + 0.5;
            float scanlineEffect = scanline * scanlineIntensity;
            
            vec3 color = texel.rgb + noise;
            color -= scanlineEffect * 0.15; // Subtle dark lines
            
            gl_FragColor = vec4(color, texel.a);
        }
    `
};

// --- CORE APP ---

let scene, camera, renderer, controls, composer, sphereMaterial, sphereMesh;
let bloomPass, rgbShiftPass, tvPass;
let clock = new THREE.Clock();

// Parameters for Debug GUI
const params = {
    // Sphere / Noise
    noiseAmplitude: 0.2,
    noiseScale: 0.5,
    noiseSpeed: 0.3,
    gridScale: 30.0,
    lineWidth: 2.0, // Now interpreted as pixel width
    // Post FX
    bloomStrength: 1.5,
    bloomRadius: 0.4,
    bloomThreshold: 0.1,
    rgbShift: 0.003,
    tvNoise: 0.5,
    tvScanline: 0.4,
    // Misc
    autoRotate: true,
    autoRotateSpeed: 0.5
};

function init() {
    // Scene setup
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    // Camera setup
    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    // Renderer setup
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Orbit Controls
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Sphere Geometry & Material (Grid/Rectangle pattern)
    const geometry = new THREE.SphereGeometry(1.5, 128, 64); 
    
    sphereMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uNoiseScale: { value: params.noiseScale },
            uNoiseAmplitude: { value: params.noiseAmplitude },
            uNoiseSpeed: { value: params.noiseSpeed },
            uColor: { value: new THREE.Color(0xffffff) },
            uGridScale: { value: params.gridScale },
            uLineWidth: { value: params.lineWidth }
        },
        vertexShader,
        fragmentShader,
        transparent: true,
        side: THREE.DoubleSide
    });

    sphereMesh = new THREE.Mesh(geometry, sphereMaterial);
    scene.add(sphereMesh);

    // Postprocessing setup
    composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        params.bloomStrength,
        params.bloomRadius,
        params.bloomThreshold
    );
    composer.addPass(bloomPass);

    rgbShiftPass = new ShaderPass(RGBShiftShaderCustom);
    rgbShiftPass.uniforms['amount'].value = params.rgbShift;
    composer.addPass(rgbShiftPass);

    tvPass = new ShaderPass(AnalogTVShader);
    tvPass.uniforms['noiseIntensity'].value = params.tvNoise;
    tvPass.uniforms['scanlineIntensity'].value = params.tvScanline;
    composer.addPass(tvPass);

    // GUI setup
    setupGUI();

    // Resize handling
    window.addEventListener('resize', onWindowResize);

    // Keyboard events
    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'd') {
            const guiEl = document.querySelector('.lil-gui');
            if (guiEl) {
                guiEl.style.display = guiEl.style.display === 'none' ? 'block' : 'none';
            }
        }
    });

    // Start animation
    animate();
}

function setupGUI() {
    const gui = new lil.GUI();
    gui.domElement.style.display = 'none'; // Hide by default
    gui.domElement.style.position = 'absolute';
    gui.domElement.style.top = '10px';
    gui.domElement.style.right = '10px';

    const noiseFolder = gui.addFolder('Sphere / Noise');
    noiseFolder.add(params, 'noiseAmplitude', 0, 0.8).onChange(v => sphereMaterial.uniforms.uNoiseAmplitude.value = v);
    noiseFolder.add(params, 'noiseScale', 0.1, 2.0).onChange(v => sphereMaterial.uniforms.uNoiseScale.value = v);
    noiseFolder.add(params, 'noiseSpeed', 0, 1.0).onChange(v => sphereMaterial.uniforms.uNoiseSpeed.value = v);
    noiseFolder.add(params, 'gridScale', 10, 100).onChange(v => sphereMaterial.uniforms.uGridScale.value = v);
    noiseFolder.add(params, 'lineWidth', 0.5, 10.0).name('Line Width (px)').onChange(v => sphereMaterial.uniforms.uLineWidth.value = v);
    noiseFolder.open();

    const fxFolder = gui.addFolder('Post FX');
    fxFolder.add(params, 'bloomStrength', 0, 3.0).onChange(v => bloomPass.strength = v);
    fxFolder.add(params, 'bloomRadius', 0, 1.0).onChange(v => bloomPass.radius = v);
    fxFolder.add(params, 'bloomThreshold', 0, 1.0).onChange(v => bloomPass.threshold = v);
    fxFolder.add(params, 'rgbShift', 0, 0.05).onChange(v => rgbShiftPass.uniforms['amount'].value = v);
    fxFolder.add(params, 'tvNoise', 0, 2.0).onChange(v => tvPass.uniforms['noiseIntensity'].value = v);
    fxFolder.add(params, 'tvScanline', 0, 1.0).onChange(v => tvPass.uniforms['scanlineIntensity'].value = v);
    fxFolder.open();

    const miscFolder = gui.addFolder('Misc');
    miscFolder.add(params, 'autoRotate');
    miscFolder.add(params, 'autoRotateSpeed', 0, 2.0);
    miscFolder.open();
}

function onWindowResize() {
    const width = window.innerWidth;
    const height = window.innerHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    composer.setSize(width, height);
}

function animate() {
    requestAnimationFrame(animate);
    
    const delta = clock.getDelta();
    const elapsed = clock.getElapsedTime();

    // Update uniforms
    sphereMaterial.uniforms.uTime.value = elapsed;
    tvPass.uniforms['time'].value = elapsed;

    // Auto rotation
    if (params.autoRotate) {
        sphereMesh.rotation.y += delta * params.autoRotateSpeed;
    }

    // Update controls
    controls.update();

    // Render
    composer.render();
}

// Execution
init();
</script>
</body>
</html>
