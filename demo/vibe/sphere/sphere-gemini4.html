<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Lava Grid Sphere - Glitch Pro</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
        #canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- External dependencies: Three.js and lil-gui for UI -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';

        // --- 1. SETTINGS & STATE (Synced with Screenshot) ---
        const params = {
            gridSize: 6.6,
            lineWidth: 0.045,
            lavaSpeed: 0.5,
            lavaStrength: 0.248,
            rotationSpeed: 0.265,
            antialias: true,
            blurFluff: 6.0,
            rgbDistort: 0.02175,
            interlace: 0.5,
            glitchPower: 0.4,    // Intensity of destruction
            glitchFreq: 0.95     // Threshold (higher = rarer, more violent)
        };

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 2.5;

        const canvas = document.getElementById('canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;

        // --- 2. RENDER PIPELINE ---
        let mainTarget;
        function updateRenderTarget() {
            if (mainTarget) mainTarget.dispose();
            const w = window.innerWidth * window.devicePixelRatio;
            const h = window.innerHeight * window.devicePixelRatio;
            mainTarget = new THREE.WebGLRenderTarget(w, h, {
                samples: params.antialias ? 8 : 0,
                format: THREE.RGBAFormat
            });
            if (sphere) sphere.material.uniforms.uAntialias.value = params.antialias ? 1.0 : 0.0;
        }

        // --- 3. CUSTOM SHADERS (ZickZack & Flicker) ---

        const vertexShader = `
            varying vec3 vPos;
            varying float vFlicker;
            uniform float uTime;
            uniform float uStrength;
            uniform float uGlitchPower;
            uniform float uGlitchFreq;

            // Random hash
            float hash(float n) { return fract(sin(n) * 43758.5453123); }

            // Simplex Noise (3D)
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vPos = position;
                
                // Determine if this frame is a glitch frame
                float timeHash = hash(floor(uTime * 15.0));
                vFlicker = step(uGlitchFreq, timeHash);
                
                // Normal lava displacement
                float lava = snoise(position + uTime * 0.5);
                
                // Violent digital shatter displacement
                float glitchDisplace = snoise(position * 8.0 + uTime * 25.0) * vFlicker;
                
                vec3 newPos = position + normal * (lava * uStrength + glitchDisplace * uGlitchPower);
                
                // Horizontal ZickZack Tearing
                if (vFlicker > 0.5) {
                    vPos.x += sin(vPos.y * 60.0 + uTime * 80.0) * uGlitchPower * 0.6;
                    vPos.z += cos(vPos.y * 40.0 - uTime * 60.0) * uGlitchPower * 0.6;
                }
                
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
            }
        `;

        const fragmentShader = `
            varying vec3 vPos;
            varying float vFlicker;
            uniform float uGrid;
            uniform float uWidth;
            uniform float uAntialias;
            uniform float uTime;

            void main() {
                vec3 grid = abs(fract(vPos * uGrid - 0.5) - 0.5);
                float d = min(grid.x, min(grid.y, grid.z));
                float line;
                
                if (uAntialias > 0.5) {
                    float w = fwidth(d);
                    line = smoothstep(uWidth - w, uWidth + w, d);
                } else {
                    line = step(uWidth, d);
                }
                
                if (line > 0.99) discard;
                
                // Apply Stroboscopic Flicker-Out
                vec3 color = vec3(1.0);
                if (vFlicker > 0.5) {
                   color *= step(0.4, fract(uTime * 30.0)); // Rapid strobe effect
                }
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const postFragmentShader = `
            varying vec2 vUv;
            uniform sampler2D tDiffuse;
            uniform float uDistort;
            uniform float uBlur;
            uniform float uInterlace;
            uniform vec2 uRes;
            uniform float uTime;

            void main() {
                vec2 uv = vUv;
                vec3 blur = vec3(0.0);
                if (uBlur > 0.0) {
                    float spread = uBlur / uRes.x;
                    blur += texture2D(tDiffuse, uv + vec2(-spread, -spread)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(0.0, -spread * 1.5)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(spread, -spread)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(-spread * 1.5, 0.0)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(0.0, 0.0)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(spread * 1.5, 0.0)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(-spread, spread)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(0.0, spread * 1.5)).rgb;
                    blur += texture2D(tDiffuse, uv + vec2(spread, spread)).rgb;
                    blur /= 9.0;
                } else {
                    blur = texture2D(tDiffuse, uv).rgb;
                }
                float r = texture2D(tDiffuse, uv + vec2(uDistort, 0.0)).r;
                float b = texture2D(tDiffuse, uv - vec2(uDistort, 0.0)).b;
                vec3 color = vec3(r, blur.g, b);
                float scanline = sin(uv.y * uRes.y * 1.5 + uTime * 5.0) * uInterlace;
                float vignette = 1.0 - length(uv - 0.5) * 1.1;
                gl_FragColor = vec4((color - scanline) * vignette, 1.0);
            }
        `;

        // --- 4. SCENE CONSTRUCTION ---
        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(1, 128, 128),
            new THREE.ShaderMaterial({
                vertexShader, fragmentShader,
                uniforms: { 
                    uTime: { value: 0 }, 
                    uGrid: { value: params.gridSize }, 
                    uWidth: { value: params.lineWidth },
                    uStrength: { value: params.lavaStrength },
                    uAntialias: { value: params.antialias ? 1.0 : 0.0 },
                    uGlitchPower: { value: params.glitchPower },
                    uGlitchFreq: { value: params.glitchFreq }
                },
                side: THREE.DoubleSide
            })
        );
        scene.add(sphere);

        const postScene = new THREE.Scene();
        const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const postQuad = new THREE.Mesh(
            new THREE.PlaneGeometry(2, 2),
            new THREE.ShaderMaterial({
                vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`, 
                fragmentShader: postFragmentShader,
                uniforms: {
                    tDiffuse: { value: null },
                    uDistort: { value: params.rgbDistort },
                    uBlur: { value: params.blurFluff },
                    uInterlace: { value: params.interlace },
                    uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uTime: { value: 0 }
                }
            })
        );
        postScene.add(postQuad);

        updateRenderTarget(); 

        // --- 5. UI CONTROL PANEL ---
        const gui = new GUI();
        gui.hide();

        const f1 = gui.addFolder('Sphere Geometry');
        f1.add(params, 'gridSize', 1, 15, 0.1).name('Grid Scale').onChange(v => sphere.material.uniforms.uGrid.value = v);
        f1.add(params, 'lineWidth', 0.001, 0.1, 0.001).name('Line Width').onChange(v => sphere.material.uniforms.uWidth.value = v);
        f1.add(params, 'lavaStrength', 0, 0.5).name('Lava Motion').onChange(v => sphere.material.uniforms.uStrength.value = v);
        f1.add(params, 'rotationSpeed', 0, 5).name('Rotation Speed');
        
        const f2 = gui.addFolder('Visual Effects');
        f2.add(params, 'antialias').name('Antialias Mode').onChange(updateRenderTarget);
        f2.add(params, 'blurFluff', 0, 40).name('Blur Fluff').onChange(v => postQuad.material.uniforms.uBlur.value = v);
        f2.add(params, 'rgbDistort', 0, 0.05).name('RGB Distort').onChange(v => postQuad.material.uniforms.uDistort.value = v);
        f2.add(params, 'interlace', 0, 1.0).name('Interlace').onChange(v => postQuad.material.uniforms.uInterlace.value = v);
        f2.add(params, 'glitchPower', 0, 2.0).name('Glitch Intensity').onChange(v => sphere.material.uniforms.uGlitchPower.value = v);
        f2.add(params, 'glitchFreq', 0.5, 1.0).name('Glitch Rarity (Inv)').onChange(v => sphere.material.uniforms.uGlitchFreq.value = v);

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'd') {
                gui._hidden ? gui.show() : gui.hide();
            }
        });

        // --- 6. ANIMATION LOOP ---
        function animate(time) {
            requestAnimationFrame(animate);
            const t = time * 0.001;
            controls.update();
            sphere.rotation.y += params.rotationSpeed * 0.01;
            sphere.material.uniforms.uTime.value = t;
            postQuad.material.uniforms.uTime.value = t;

            renderer.setRenderTarget(mainTarget);
            renderer.render(scene, camera);
            renderer.setRenderTarget(null);

            postQuad.material.uniforms.tDiffuse.value = mainTarget.texture;
            renderer.render(postScene, postCamera);
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth, h = window.innerHeight;
            camera.aspect = w / h; camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            updateRenderTarget();
            postQuad.material.uniforms.uRes.value.set(w, h);
        });

        animate(0);
    </script>
</body>
</html>
