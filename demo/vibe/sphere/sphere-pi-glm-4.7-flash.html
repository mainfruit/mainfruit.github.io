<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lava Lamp Sphere - 3D Wireframe with TV Effect</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #gui-container { position: absolute; top: 0; right: 0; z-index: 100; }
    </style>
</head>
<body>
    <div id="gui-container"></div>

    <!-- Import map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.min.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- Lil-gui (UMD) -->
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>

    <script type="module">
        // === THREE.JS IMPORTS ===
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { FilmPass } from 'three/addons/postprocessing/FilmPass.js';
        import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';

        // === PARAMETERS ===
        const params = {
            lavalamp: {
                amplitude: 0.25,
                frequency: 1.5,
                speed: 1.8,
                wireframeColor: '#ffffff'
            },
            postfx: {
                bloomStrength: 1.2,
                bloomRadius: 0.8,
                bloomThreshold: 0.2,
                rgbShift: 0.002,
                filmScanlines: 0.3
            },
            misc: {
                autoRotate: true,
                autoRotateSpeed: 0.3
            }
        };

        // === SCENE SETUP ===
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;

        // === CUSTOM SHADER MATERIAL WITH VERTEX DISPLACEMENT ===
        const lavalampMaterial = new THREE.ShaderMaterial({
            uniforms: {
                amplitude: { value: params.lavalamp.amplitude },
                frequency: { value: params.lavalamp.frequency },
                time: { value: 0 },
                color: { value: new THREE.Color(params.lavalamp.wireframeColor) }
            },
            vertexShader: `
                varying vec2 vUv;
                varying float vNoise;
                uniform float amplitude;
                uniform float frequency;
                uniform float time;

                // Simplex noise 3D
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
                float snoise(vec3 v) {
                    const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                    const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                    vec3 i  = floor(v + dot(v, C.yyy) );
                    vec3 x0 = v - i + dot(i, C.xxx) ;
                    vec3 g = step(x0.yzx, x0.xyz);
                    vec3 l = 1.0 - g;
                    vec3 i1 = min( g.xyz, l.zxy );
                    vec3 i2 = max( g.xyz, l.zxy );
                    vec3 x1 = x0 - i1 + C.xxx;
                    vec3 x2 = x0 - i2 + C.yyy;
                    vec3 x3 = x0 - D.yyy;
                    i = mod289(i);
                    vec4 p = permute( permute( permute(
                                i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                            + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                            + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                    float n_ = 0.142857142857;
                    vec3  ns = n_ * D.wyz - D.xzx;
                    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                    vec4 x_ = floor(j * ns.z);
                    vec4 y_ = floor(j - 7.0 * x_ );
                    vec4 x = x_ *ns.x + ns.yyyy;
                    vec4 y = y_ *ns.x + ns.yyyy;
                    vec4 h = 1.0 - abs(x) - abs(y);
                    vec4 b0 = vec4( x.xy, y.xy );
                    vec4 b1 = vec4( x.zw, y.zw );
                    vec4 s0 = floor(b0)*2.0 + 1.0;
                    vec4 s1 = floor(b1)*2.0 + 1.0;
                    vec4 sh = -step(h, vec4(0.0));
                    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                    vec3 p0 = vec3(a0.xy,h.x);
                    vec3 p1 = vec3(a0.zw,h.y);
                    vec3 p2 = vec3(a1.xy,h.z);
                    vec3 p3 = vec3(a1.zw,h.w);
                    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                    p0 *= norm.x;
                    p1 *= norm.y;
                    p2 *= norm.z;
                    p3 *= norm.w;
                    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                    m = m * m;
                    return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
                }

                void main() {
                    vUv = uv;
                    float noise = snoise(position * frequency + time * 0.5);
                    vNoise = noise;
                    vec3 newPos = position + normal * noise * amplitude;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
                }
            `,
            fragmentShader: `
                varying vec2 vUv;
                varying float vNoise;
                uniform vec3 color;

                void main() {
                    float intensity = 0.5 + 0.5 * vNoise;
                    vec3 finalColor = color * intensity;
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `,
            wireframe: true,
            side: THREE.DoubleSide
        });

        // === SPHERE GEOMETRY ===
        const sphereGeometry = new THREE.SphereGeometry(1.2, 64, 64);
        const sphere = new THREE.Mesh(sphereGeometry, lavalampMaterial);
        scene.add(sphere);

        // === POST PROCESSING ===
        const composer = new EffectComposer(renderer);

        // Render pass
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Bloom pass
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            params.postfx.bloomStrength,
            params.postfx.bloomRadius,
            params.postfx.bloomThreshold
        );
        composer.addPass(bloomPass);

        // RGB shift pass
        const rgbShiftPass = new ShaderPass(RGBShiftShader);
        rgbShiftPass.uniforms['amount'].value = params.postfx.rgbShift;
        composer.addPass(rgbShiftPass);

        // Film/TV scanlines pass
        const filmPass = new FilmPass(params.postfx.filmScanlines, false);
        composer.addPass(filmPass);

        // === DEBUG UI (lil-gui) ===
        const gui = new lil.GUI();
        gui.domElement.style.display = 'none';

        gui.add(params.lavalamp, 'amplitude', 0.05, 0.8).name('Noise Amplitude').onChange(v => lavalampMaterial.uniforms.amplitude.value = v);
        gui.add(params.lavalamp, 'frequency', 0.2, 4.0).name('Noise Frequency').onChange(v => lavalampMaterial.uniforms.frequency.value = v);
        gui.add(params.lavalamp, 'speed', 0.1, 5.0).name('Anim Speed').onChange(v => lavalampMaterial.uniforms.time.needsUpdate = true);
        gui.addColor(params.lavalamp, 'wireframeColor').name('Wireframe Color').onChange(v => lavalampMaterial.uniforms.color.value.set(v));

        const postfxFolder = gui.addFolder('Post FX');
        postfxFolder.add(params.postfx, 'bloomStrength', 0, 3.0).onChange(v => bloomPass.strength = v);
        postfxFolder.add(params.postfx, 'bloomRadius', 0, 2.0).onChange(v => bloomPass.radius = v);
        postfxFolder.add(params.postfx, 'bloomThreshold', 0, 1.0).onChange(v => bloomPass.threshold = v);
        postfxFolder.add(params.postfx, 'rgbShift', 0, 0.01).onChange(v => rgbShiftPass.uniforms['amount'].value = v);
        postfxFolder.add(params.postfx, 'filmScanlines', 0, 1.0).onChange(v => filmPass.uniforms.intensity.value = v);
        postfxFolder.open();

        const miscFolder = gui.addFolder('Controls');
        miscFolder.add(params.misc, 'autoRotate');
        miscFolder.add(params.misc, 'autoRotateSpeed', 0, 2.0).name('Rotate Speed');

        // === KEYBOARD TOGGLE ===
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'd') {
                gui.domElement.style.display = gui.domElement.style.display === 'none' ? 'block' : 'none';
            }
        });

        // === RESIZE HANDLER ===
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // === ANIMATION LOOP ===
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();
            lavalampMaterial.uniforms.time.value = elapsed * params.lavalamp.speed;

            if (params.misc.autoRotate) {
                sphere.rotation.y += params.misc.autoRotateSpeed * 0.01;
            }

            controls.update();
            composer.render();
        }

        animate();
    </script>
</body>
</html>
