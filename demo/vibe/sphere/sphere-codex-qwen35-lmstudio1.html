<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lava Sphere - Three.js Artwork</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>

    <!-- Import map for Three.js and addons -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- lil-gui UMD build -->
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // ============================================================
        // Configuration and state
        // ============================================================
        const config = {
            noiseAmplitude: 0.3,
            noiseScale: 1.5,
            animationSpeed: 0.4,
            bloomStrength: 1.5,
            bloomRadius: 0.4,
            bloomThreshold: 0.1,
            rgbShiftAmount: 0.002,
            filmNoiseIntensity: 0.3,
            filmScanlineIntensity: 0.5,
            autoRotate: true,
            autoRotateSpeed: 0.5
        };

        let guiVisible = false;
        let timeUniform = 0;

        // ============================================================
        // Scene setup
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // ============================================================
        // OrbitControls setup
        // ============================================================
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableRotate = true;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 15;

        // ============================================================
        // Custom vertex shader for noise-based displacement
        // ============================================================
        const vertexShader = `
            uniform float time;
            uniform float amplitude;
            uniform float scale;
            
            varying vec2 vUv;
            varying vec3 vPosition;
            varying vec3 vNormal;

            // Simplex 3D noise function
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) {
                const vec2  C = vec2(1.0/6.0, 1.0/3.0);
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);

                vec3 i = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);

                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);

                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;

                i = mod289(i);
                vec4 p = permute(permute(permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0))
                          + i.y + vec4(0.0, i1.y, i2.y, 1.0)) 
                          + i.x + vec4(0.0, i1.x, i2.x, 1.0));

                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;

                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);

                vec4 x = x_ * ns.x + ns.yyyy;
                vec4 y = y_ * ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);

                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);

                vec4 s0 = floor(b0) * 2.0 + 1.0;
                vec4 s1 = floor(b1) * 2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));

                vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);

                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;

                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }

            void main() {
                vUv = uv;
                
                float noiseVal = snoise(position * scale + time);
                vec3 displacedPosition = position + normal * noiseVal * amplitude;
                
                vPosition = displacedPosition;
                vNormal = normal;
                
                gl_Position = projectionMatrix * modelViewMatrix * vec4(displacedPosition, 1.0);
            }
        `;

        // ============================================================
        // Fragment shader for wireframe lines - pure white
        // ============================================================
        const fragmentShader = `
            void main() {
                gl_FragColor = vec4(1.0, 1.0, 1.0, 1.0);
            }
        `;

        // ============================================================
        // Create sphere with custom shader material (wireframe look)
        // ============================================================
        const geometry = new THREE.IcosahedronGeometry(2, 64);
        
        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: {
                time: { value: 0 },
                amplitude: { value: config.noiseAmplitude },
                scale: { value: config.noiseScale }
            },
            wireframe: true,
            side: THREE.DoubleSide
        });

        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // ============================================================
        // RGB Shift shader definition
        // ============================================================
        const RGBShiftShader = {
            uniforms: {
                tDiffuse: { value: null },
                amount:   { value: config.rgbShiftAmount }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float amount;
                varying vec2 vUv;

                void main() {
                    vec2 offset = vec2(amount * 0.01, 0.0);
                    vec4 red   = texture2D(tDiffuse, vUv + offset);
                    vec4 green = texture2D(tDiffuse, vUv);
                    vec4 blue  = texture2D(tDiffuse, vUv - offset);
                    gl_FragColor = vec4(red.r, green.g, blue.b, 1.0);
                }
            `
        };

        // ============================================================
        // Film/scanline shader definition
        // ============================================================
        const FilmShader = {
            uniforms: {
                tDiffuse:   { value: null },
                time:       { value: 0.0 },
                intensity:  { value: config.filmNoiseIntensity },
                grain:      { value: config.filmScanlineIntensity },
                scanlines:  { value: config.filmScanlineIntensity },
                bend:       { value: 0.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float time;
                uniform float intensity;
                uniform float grain;
                uniform float scanlines;
                uniform float bend;
                varying vec2 vUv;

                // Random function
                float random(vec2 st) {
                    return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
                }

                void main() {
                    vec2 uv = vUv;
                    
                    // Slight screen curvature
                    if (bend > 0.0) {
                        uv.x -= (uv.y - 0.5) * bend;
                    }
                    
                    vec4 color = texture2D(tDiffuse, uv);
                    
                    // Add grain
                    float noise = random(uv + floor(time));
                    color.rgb += noise * grain * intensity;
                    
                    // Scanlines
                    float scanline = sin(uv.y * 100.0 + time * 2.0);
                    color.rgb -= scanline * scanlines * intensity * 0.1;
                    
                    gl_FragColor = color;
                }
            `
        };

        // ============================================================
        // Postprocessing setup with EffectComposer
        // ============================================================
        const composer = new EffectComposer(renderer);
        
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            config.bloomStrength,
            config.bloomRadius,
            config.bloomThreshold
        );
        composer.addPass(bloomPass);

        const rgbShiftPass = new ShaderPass(RGBShiftShader);
        composer.addPass(rgbShiftPass);

        const filmPass = new ShaderPass(FilmShader);
        composer.addPass(filmPass);

        // ============================================================
        // lil-gui debug panel setup
        // ============================================================
        const gui = new lil.GUI({ title: 'Lava Sphere Controls' });
        
        gui.add(config, 'noiseAmplitude', 0, 0.6).name('Noise Amplitude').onChange(v => {
            material.uniforms.amplitude.value = v;
        });
        gui.add(config, 'noiseScale', 0.2, 4.0).name('Noise Scale').onChange(v => {
            material.uniforms.scale.value = v;
        });

        const bloomFolder = gui.addFolder('Bloom');
        bloomFolder.add(config, 'bloomStrength', 0, 3).name('Strength').onChange(v => {
            bloomPass.strength = v;
        });
        bloomFolder.add(config, 'bloomRadius', 0, 1).name('Radius').onChange(v => {
            bloomPass.radius = v;
        });
        bloomFolder.add(config, 'bloomThreshold', 0, 1).name('Threshold').onChange(v => {
            bloomPass.threshold = v;
        });

        const postFxFolder = gui.addFolder('Post FX');
        postFxFolder.add(config, 'rgbShiftAmount', 0, 0.01).name('RGB Shift').onChange(v => {
            rgbShiftPass.uniforms.amount.value = v;
        });
        postFxFolder.add(config, 'filmNoiseIntensity', 0, 1).name('Film Noise').onChange(v => {
            filmPass.uniforms.grain.value = v;
        });
        postFxFolder.add(config, 'filmScanlineIntensity', 0, 1).name('Scanlines').onChange(v => {
            filmPass.uniforms.scanlines.value = v;
        });

        const miscFolder = gui.addFolder('Misc');
        miscFolder.add(config, 'autoRotate').name('Auto Rotate').onChange(v => {
            config.autoRotate = v;
        });
        miscFolder.add(config, 'autoRotateSpeed', 0, 2).name('Rotation Speed').onChange(v => {
            config.autoRotateSpeed = v;
        });

        gui.domElement.style.display = 'none';
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'd' || e.key === 'D') {
                guiVisible = !guiVisible;
                gui.domElement.style.display = guiVisible ? 'block' : 'none';
            }
        });

        // ============================================================
        // Resize handler
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================
        // Animation loop
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);
            
            timeUniform += config.animationSpeed * 0.016;
            material.uniforms.time.value = timeUniform;
            
            if (config.autoRotate) {
                sphere.rotation.y += config.autoRotateSpeed * 0.01;
            }
            
            controls.update();
            composer.render();
        }

        animate();
    </script>
</body>
</html>
