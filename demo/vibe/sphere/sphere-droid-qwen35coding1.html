<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wireframe Sphere</title>
<style>body{margin:0;overflow:hidden;background:#000;}canvas{display:block;}#postCanvas{position:fixed;top:0;left:0;pointer-events:none;z-index:1;}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/+esm","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="threeCanvas"></canvas>
<canvas id="postCanvas"></canvas>
<script type="module">
// setup
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('threeCanvas'), antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const canvas = renderer.domElement;
const postCanvas = document.getElementById('postCanvas');

function setSize(){
 canvas.width = window.innerWidth;
 canvas.height = window.innerHeight;
 postCanvas.width = canvas.width;
 postCanvas.height = canvas.height;
 renderer.setSize(window.innerWidth, window.innerHeight);
}
setSize();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.z = 5;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

const scene = new THREE.Scene();

let geometry, mesh, origPositions;
const uiParams = {widthSegments:48, heightSegments:48, radius:2.0, waveSpeed:0.4, waveHeight:0.3, noiseScale:0.8, rgbShift:1.6, scanLines:4, blur:0.6, tvNoise:0.5};
function getParam(k){return k===0?uiParams.widthSegments:k===1?uiParams.heightSegments:k===2?uiParams.radius:k===3?uiParams.waveSpeed:k===4?uiParams.waveHeight:k===5?uiParams.noiseScale:k===6?uiParams.rgbShift:k===7?uiParams.scanLines:k===8?uiParams.blur:k===9?uiParams.tvNoise:0;}
function setParam(k,v){if(k===0)uiParams.widthSegments=v;if(k===1)uiParams.heightSegments=v;if(k===2)uiParams.radius=v;if(k===3)uiParams.waveSpeed=v;if(k===4)uiParams.waveHeight=v;if(k===5)uiParams.noiseScale=v;if(k===6)uiParams.rgbShift=v;if(k===7)uiParams.scanLines=v;if(k===8)uiParams.blur=v;if(k===9)uiParams.tvNoise=v;}

function buildSphere(){
 geometry?.dispose();
 geometry = new THREE.SphereGeometry(uiParams.radius, uiParams.widthSegments, uiParams.heightSegments);
 origPositions = new Float32Array(geometry.attributes.position.array);
 mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({color:'#fff', wireframe:true}));
 scene.add(mesh);
}
buildSphere();

// noise
function perlin(nx, ny, nz){
 const xi = Math.floor(nx), yi = Math.floor(ny), zi = Math.floor(nz);
 const xf = nx - xi, yf = ny - yi, zf = nz - zi;
 const w = (x)=>3*x*x - 2*x*x*x;
 const g = (x,y,z)=>(Math.sin(x)+1)*Math.cos(y) + (Math.sin(y)+1)*Math.cos(z);
 const g1 = g(xi, yi, zi), g2 = g(xi+1, yi, zi), g3 = g(xi, yi+1, zi), g4 = g(xi+1, yi+1, zi);
 const g5 = g(xi, yi, zi+1), g6 = g(xi+1, yi, zi+1), g7 = g(xi, yi+1, zi+1), g8 = g(xi+1, yi+1, zi+1);
 const v1 = w(xf)*g1 + w(1-xf)*g2, v2 = w(xf)*g3 + w(1-xf)*g4;
 const v3 = w(xf)*g5 + w(1-xf)*g6, v4 = w(xf)*g7 + w(1-xf)*g8;
 const v5 = w(yf)*v1 + w(1-yf)*v2, v6 = w(yf)*v3 + w(1-yf)*v4;
 const res = w(zf)*v5 + w(1-zf)*v6;
 return res + (Math.random()-0.5)*0.02;
}

// deform
const clock = new THREE.Clock();
let t = 0;
const noiseVec = new THREE.Vector3();

function animate(){
 requestAnimationFrame(animate);
 const dt = clock.getDelta();
 t += dt * uiParams.waveSpeed;
 const pos = geometry.attributes.position;
 for(let i=0, n=pos.count;i<n;i++){
  const ox = origPositions[i*3], oy = origPositions[i*3+1], oz = origPositions[i*3+2];
  const nx = ox, ny = oy, nz = oz;
  const ns = nx * uiParams.noiseScale, nt = ny * uiParams.noiseScale, nu = oz * uiParams.noiseScale;
  const noiseVal = perlin(ns + t*0.3, nt + t*0.2, nu + t*0.1);
  noiseVec.set(nx, ny, nz).normalize().multiplyScalar(noiseVal * uiParams.waveHeight);
  pos.setXYZ(i, ox + noiseVec.x, oy + noiseVec.y, oz + noiseVec.z);
 }
 pos.needsUpdate = true;
 renderer.render(scene, camera);
 postCanvas.width = canvas.width;
 postCanvas.height = canvas.height;
 postCanvas.getContext('2d').clearRect(0, 0, postCanvas.width, postCanvas.height);

 const ctx = postCanvas.getContext('2d');
 ctx.drawImage(canvas, 0, 0);

 const shift = uiParams.rgbShift;
 const blurPx = uiParams.blur;
 ctx.globalCompositeOperation = 'screen';
 ctx.filter = `blur(${blurPx}px) saturate(3) hue-rotate(0deg)`;
 ctx.globalAlpha = 0.35;
 ctx.drawImage(canvas, -shift, 0);
 ctx.drawImage(canvas, shift, 0);

 ctx.filter = 'none';
 ctx.globalAlpha = 1;
 for(let y=0;y<postCanvas.height;y+=Math.max(1,uiParams.scanLines)){
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(0, y, postCanvas.width, Math.max(1, uiParams.scanLines)-0.5);
 }

 if(uiParams.tvNoise > 0){
  const id = ctx.createImageData(postCanvas.width, postCanvas.height);
  for(let i=0;i<id.data.length;i+=4){
   const v = (Math.random()-0.5)*uiParams.tvNoise*50;
   id.data[i] = id.data[i+1] = id.data[i+2] = Math.max(0, Math.min(255, 128+v));
   id.data[i+3] = Math.max(0, Math.min(255, 50+v*2));
  }
  ctx.putImageData(id, 0, 0);
 }

 ctx.globalCompositeOperation = 'source-over';
 ctx.globalAlpha = 1;
 const rad = ctx.createRadialGradient(postCanvas.width/2, postCanvas.height/2, Math.min(postCanvas.width, postCanvas.height)*0.2, postCanvas.width/2, postCanvas.height/2, Math.max(postCanvas.width, postCanvas.height)*0.7);
 rad.addColorStop(0, 'rgba(0,0,0,0)');
 rad.addColorStop(1, 'rgba(0,0,0,0.55)');
 ctx.fillStyle = rad;
 ctx.fillRect(0, 0, postCanvas.width, postCanvas.height);
 controls.update();
}

function mkSl(label,key,val,min,max,step){const d=document.createElement('div');d.style='margin:4px 0;display:flex;align-items:center;gap:8px;';const t=document.createElement('div');t.style='font-size:11px;min-width:100px;height:14px;line-height:14px;';t.textContent=label;const i=document.createElement('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;i.style.flex='1';i.style.height='20px';i.id='s'+key;const v=document.createElement('span');v.style='font-size:11px;min-width:25px;text-align:right;';v.textContent=val;i.addEventListener('input',()=>{v.textContent=+i.value;uiParams[key]=+i.value;if([0,1,2].includes(key))buildSphere();});d.append(t,i,v);return d;}const p=document.createElement('div');p.style='position:fixed;top:10px;right:10px;background:rgba(0,0,0,0.85);padding:12px;border-radius:6px;font-family:monospace;font-size:11px;pointer-events:auto;min-width:160px;line-height:15px;';const s1=document.createElement('div');s1.style='font-weight:bold;margin:6px 0 4px;border-bottom:1px solid #333;padding-bottom:2px;';s1.textContent='Sphere';p.append(s1);p.append(mkSl('Width Segments','widthSegments',48,4,128,1),mkSl('Height Segments','heightSegments',48,4,128,1),mkSl('Radius','radius',2,0.5,5,0.1));const s2=document.createElement('div');s2.style='font-weight:bold;margin:10px 0 4px;border-bottom:1px solid #333;padding-bottom:2px;';s2.textContent='Animation';p.append(s2);p.append(mkSl('Wave Speed','waveSpeed',0.4,0,3,0.1),mkSl('Wave Height','waveHeight',0.3,0,1.5,0.1),mkSl('Noise Scale','noiseScale',0.8,0.1,3,0.1));const s3=document.createElement('div');s3.style='font-weight:bold;margin:10px 0 4px;border-bottom:1px solid #333;padding-bottom:2px;';s3.textContent='Post FX';p.append(s3);p.append(mkSl('RGB Shift','rgbShift',1.6,0,10,0.1),mkSl('Scan Lines','scanLines',4,0,10,0.1),mkSl('Blur','blur',0.6,0,5,0.1),mkSl('TV Noise','tvNoise',0.5,0,1,0.05));p.addEventListener('keydown',e=>{if(e.key==='d'){e.preventDefault();e.target.blur();}});document.body.appendChild(p);

window.addEventListener('resize',()=>{
 camera.aspect = window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 canvas.width = window.innerWidth;
 canvas.height = window.innerHeight;
 postCanvas.width = canvas.width;
 postCanvas.height = canvas.height;
 renderer.setSize(window.innerWidth, window.innerHeight);
});
animate();
</script>
</body>
</html>
