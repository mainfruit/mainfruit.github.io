<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Lava Sphere</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';
import { FilmShader } from 'three/addons/shaders/FilmShader.js';
import { GUI } from 'https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm';

/**
 * SHADERS
 */

const vertexShader = `
    uniform float uTime;
    uniform float uAmplitude;
    uniform float uScale;
    uniform float uSpeed;

    varying vec3 vNormal;
    varying vec3 vPosition;

    // Simplex 3D Noise 
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
    float snoise(vec3 v){ 
        const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
        const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy) );
        vec3 x0 =   v - i + dot(i, C.xxx) ;
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min( g.xyz, l.zxy );
        vec3 i2 = max( g.xyz, l.zxy );
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod(i, 289.0 ); 
        vec4 p = permute( permute( permute( 
                     i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                   + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                   + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
        float n_ = 1.0/7.0;
        vec3  ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_ );
        vec4 x = x_ *ns.x + ns.yyyy;
        vec4 y = y_ *ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4( x.xy, y.xy );
        vec4 b1 = vec4( x.zw, y.zw );
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
        vec3 p0 = vec3(a0.xy,h.x);
        vec3 p1 = vec3(a0.zw,h.y);
        vec3 p2 = vec3(a1.xy,h.z);
        vec3 p3 = vec3(a1.zw,h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
    }

    void main() {
        vNormal = normal;
        // Displace vertices along normals using noise
        float noise = snoise(position * uScale + uTime * uSpeed);
        vec3 newPosition = position + normal * noise * uAmplitude;
        vPosition = newPosition;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
`;

const fragmentShader = `
    void main() {
        gl_FragColor = vec4(0.9, 0.9, 0.9, 1.0);
    }
`;

/**
 * APP SETUP
 */

const params = {
    noiseAmplitude: 0.25,
    noiseScale: 0.8,
    noiseSpeed: 0.5,
    bloomStrength: 1.5,
    bloomRadius: 0.4,
    bloomThreshold: 0.1,
    rgbShift: 0.003,
    filmNoise: 0.5,
    filmScanline: 0.3,
    autoRotate: true,
    autoRotateSpeed: 0.2
};

let scene, camera, renderer, composer, controls, sphereLine, clock;
let bloomPass, rgbShiftPass, filmPass;

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    clock = new THREE.Clock();

    // Sphere Geometry
    const geometry = new THREE.SphereGeometry(1.5, 64, 64);
    const edges = new THREE.EdgesGeometry(geometry);

    // Material
    const material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms: {
            uTime: { value: 0 },
            uAmplitude: { value: params.noiseAmplitude },
            uScale: { value: params.noiseScale },
            uSpeed: { value: params.noiseSpeed }
        },
        transparent: true,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
    });

    sphereLine = new THREE.LineSegments(edges, material);
    scene.add(sphereLine);

    // Controls
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Post-processing
    composer = new EffectComposer(renderer);
    
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        params.bloomStrength,
        params.bloomRadius,
        params.bloomThreshold
    );
    composer.addPass(bloomPass);

    // RGB Shift Pass - more defensive
    rgbShiftPass = new ShaderPass(RGBShiftShader);
    if (rgbShiftPass.uniforms && rgbShiftPass.uniforms.amount) {
        rgbShiftPass.uniforms.amount.value = params.rgbShift;
    }
    composer.addPass(rgbShiftPass);

    // Film Pass - more defensive
    filmPass = new ShaderPass(FilmShader);
    if (filmPass.uniforms && filmPass.uniforms.n) {
        filmPass.uniforms.n.value = params.filmNoise;
    }
    if (filmPass.uniforms && filmPass.uniforms.s) {
        filmPass.uniforms.s.value = params.filmScanline;
    }
    composer.addPass(filmPass);

    // GUI
    const gui = new GUI();
    const noiseFolder = gui.addFolder('Sphere / Noise');
    noiseFolder.add(params, 'noiseAmplitude', 0, 1).onChange(v => material.uniforms.uAmplitude.value = v);
    noiseFolder.add(params, 'noiseScale', 0.1, 4).onChange(v => material.uniforms.uScale.value = v);
    noiseFolder.add(params, 'noiseSpeed', 0, 2).onChange(v => material.uniforms.uSpeed.value = v);

    const postFolder = gui.addFolder('Post FX');
    postFolder.add(params, 'bloomStrength', 0, 3).onChange(v => bloomPass.strength = v);
    postFolder.add(params, 'bloomRadius', 0, 1).onChange(v => bloomPass.radius = v);
    postFolder.add(params, 'bloomThreshold', 0, 1).onChange(v => bloomPass.threshold = v);
    postFolder.add(params, 'rgbShift', 0, 0.05).onChange(v => {
        if (rgbShiftPass.uniforms && rgbShiftPass.uniforms.amount) {
            rgbShiftPass.uniforms.amount.value = v;
        }
    });
    postFolder.add(params, 'filmNoise', 0, 1).onChange(v => {
        if (filmPass.uniforms && filmPass.uniforms.n) {
            filmPass.uniforms.n.value = v;
        }
    });
    postFolder.add(params, 'filmScanline', 0, 1).onChange(v => {
        if (filmPass.uniforms && filmPass.uniforms.s) {
            filmPass.uniforms.s.value = v;
        }
    });

    const miscFolder = gui.addFolder('Misc');
    miscFolder.add(params, 'autoRotate');
    miscFolder.add(params, 'autoRotateSpeed', 0, 1);

    gui.domElement.style.display = 'none';
    
    // Key listener for GUI toggle
    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'd') {
            gui.domElement.style.display = gui.domElement.style.display === 'none' ? 'block' : 'none';
        }
    });

    // Resize handler
    window.addEventListener('resize', onWindowResize);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);
    
    const delta = clock.getDelta();
    const elapsed = clock.getElapsedTime();

    // Update material uniforms
    sphereLine.material.uniforms.uTime.value = elapsed;

    // Auto rotation
    if (params.autoRotate) {
        sphereLine.rotation.y += params.autoRotateSpeed * delta;
        sphereLine.rotation.z += params.autoRotateSpeed * 0.5 * delta;
    }

    controls.update();
    composer.render();
}

init();
animate();

</script>
</body>
</html>
