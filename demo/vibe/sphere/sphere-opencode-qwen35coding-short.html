<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Lava Lamp Sphere</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
}
}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let sphereRadiusVal = 2;
let bloomEnabledVal = true;
let bloomIntensityVal = 1.0;
let bloomThresholdVal = 0.0;
let bloomRadiusVal = 0.5;
let bloomStrengthVal = 1.0;
let rgbEnabledVal = true;
let rgbAmountVal = 0.005;
let blurEnabledVal = true;
let blurAmountVal = 0.002;
let speedVal = 0.5;
let dispVal = 0.5;

const permVal = new Uint8Array(512);
for (let ii = 0; ii < 256; ii++) { permVal[ii] = Math.floor(Math.random() * 256); permVal[ii + 256] = permVal[ii]; }

const geometry = new THREE.IcosahedronGeometry(sphereRadiusVal, 64);
const material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.8 });
const sphere = new THREE.Mesh(geometry, material);
scene.add(sphere);

const originalPositions = geometry.attributes.position.clone();

let uiVisible = false;
const uiPanel = document.createElement('div');
uiPanel.style.cssText = 'position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 20px; color: white; border-radius: 8px; display: flex; flex-direction: column; font-family: sans-serif; gap: 10px;';
uiPanel.style.display = 'none';

function createSlider(label, value, min, max, onChange) {
const div = document.createElement('div');
div.style.cssText = 'margin: 5px 0;';
div.innerHTML = `<label style="display:block;margin-bottom:3px;font-size:12px;">${label}: ${value.toFixed(2)}</label>`;
const slider = document.createElement('input');
slider.type = 'range';
slider.min = min;
slider.max = max;
slider.step = 0.01;
slider.value = value;
slider.style.width = '100%';
slider.addEventListener('input', (e) => {
div.querySelector('label').textContent = `${label}: ${parseFloat(e.target.value).toFixed(2)}`;
onChange(parseFloat(e.target.value));
});
div.appendChild(slider);
uiPanel.appendChild(div);
return slider;
}

function createToggle(label, value, onChange) {
const div = document.createElement('div');
div.style.cssText = 'margin: 5px 0; display: flex; align-items: center;';
const toggle = document.createElement('input');
toggle.type = 'checkbox';
toggle.checked = value;
toggle.style.marginRight = '10px';
toggle.style.width = '18px';
toggle.style.height = '18px';
toggle.addEventListener('change', (e) => onChange(e.target.checked));
const labelEl = document.createElement('span');
labelEl.textContent = label;
labelEl.style.fontSize = '12px';
div.append(labelEl, toggle);
uiPanel.appendChild(div);
return toggle;
}

createSlider('Sphere Radius', 2, 0.5, 5, (v) => {
sphereRadiusVal = v;
const newGeom = new THREE.IcosahedronGeometry(sphereRadiusVal, 64);
const newMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.8 });
sphere.geometry.dispose();
sphere.geometry = newGeom;
sphere.material.dispose();
sphere.material = newMat;
}

);

const sliderSpeed = createSlider('Anim Speed', 0.5, 0.0, 10.0, (v) => { speedVal = v; });
const sliderDisp = createSlider('Displacement', 0.5, 0.0, 5.0, (v) => { dispVal = v; });

const toggleBloom = createToggle('Bloom (Glow)', bloomEnabledVal, (v) => { bloomEnabledVal = v; bloomPass.enabled = v; });
createSlider('Bloom Intensity', 1.0, 0.0, 10.0, (v) => { bloomIntensityVal = v; bloomPass.strength = v; });

const toggleRgb = createToggle('RGB Distortion', rgbEnabledVal, (v) => { rgbEnabledVal = v; rgbShader.uniforms.uEnable.value = v; });
createSlider('RGB Amount', 0.005, 0.0, 0.02, (v) => { rgbAmountVal = v; rgbShader.uniforms.uOffset.value = v; });

const toggleBlur = createToggle('Blur (Scanline)', blurEnabledVal, (v) => { blurEnabledVal = v; blurShader.uniforms.uEnable.value = v; });
createSlider('Blur Amount', 0.002, 0.0, 0.01, (v) => { blurAmountVal = v; blurShader.uniforms.uAmount.value = v; });

uiPanel.style.display = 'none';
document.body.appendChild(uiPanel);

const rgbShader = {
uniforms: { tDiffuse: { value: null }, uEnable: { value: true }, uOffset: { value: 0.005 } },
vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
fragmentShader: `varying vec2 vUv; uniform sampler2D tDiffuse; uniform bool uEnable; uniform float uOffset; void main() { vec2 uv = vUv; vec4 color = texture2D(tDiffuse, uv); if (uEnable && uOffset > 0.0) { float offset = uOffset * 0.005; color.r = texture2D(tDiffuse, uv + vec2(offset, 0.0)).r; color.g = texture2D(tDiffuse, uv + vec2(0.0, offset * 0.5)).g; color.b = texture2D(tDiffuse, uv - vec2(offset, 0.0)).b; } gl_FragColor = color; }`
};

const rgbPass = new ShaderPass(rgbShader);

const blurShader = {
uniforms: { tDiffuse: { value: null }, uEnable: { value: true }, uAmount: { value: 0.002 } },
vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
fragmentShader: `varying vec2 vUv; uniform sampler2D tDiffuse; uniform bool uEnable; uniform float uAmount; void main() { vec2 uv = vUv; vec4 color = texture2D(tDiffuse, uv); if (uEnable && uAmount > 0.0) { float offset = uAmount * 0.01; vec4 sum = texture2D(tDiffuse, uv); sum += texture2D(tDiffuse, uv + vec2(offset, 0.0)); sum += texture2D(tDiffuse, uv - vec2(offset, 0.0)); sum += texture2D(tDiffuse, uv + vec2(0.0, offset)); sum += texture2D(tDiffuse, uv - vec2(0.0, offset)); sum *= 0.25; color = mix(color, sum, 0.8); } gl_FragColor = color; }`
};

const blurPass = new ShaderPass(blurShader);

const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), bloomStrengthVal, bloomRadiusVal, bloomThresholdVal);
bloomPass.strength = bloomIntensityVal;
bloomPass.enabled = bloomEnabledVal;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(bloomPass);
composer.addPass(rgbPass);
composer.addPass(blurPass);

window.addEventListener('keydown', (e) => { if (e.key === 'd') { uiVisible = !uiVisible; uiPanel.style.display = uiVisible ? 'flex' : 'none'; } });

window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight); });

const clock = new THREE.Clock();

function animate() {
requestAnimationFrame(animate);
const time = clock.getElapsedTime() * speedVal;
const positions = geometry.attributes.position;
const posArray = positions.array;
const origArray = originalPositions.array;
for (let i = 0; i < positions.count; i++) {
const nxOrig = origArray[i * 3 + 0]; const nyOrig = origArray[i * 3 + 1]; const nzOrig = origArray[i * 3 + 2];
const mag = Math.sqrt(nxOrig * nxOrig + nyOrig * nyOrig + nzOrig * nzOrig);
if (mag > 0.0001) {
const angle = (i * 17.0 + time * 2.0) * 0.1;
const noiseVal = Math.sin(angle) * Math.cos(angle * 0.5) * Math.sin(angle * 0.3);
const scale = 1.0 + noiseVal * dispVal;
posArray[i * 3 + 0] = nxOrig * scale;
posArray[i * 3 + 1] = nyOrig * scale;
posArray[i * 3 + 2] = nzOrig * scale;
}
}
positions.needsUpdate = true; geometry.computeVertexNormals();
sphere.rotation.y += 0.001;
controls.update(); composer.render();
}

animate();
</script>
</body>
</html>
