<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Wireframe Sphere</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
canvas { display: block; }
#controls { position: fixed; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.85); padding: 20px; border-radius: 8px; color: #fff; min-width: 200px; z-index: 100; }
.control-group { margin-bottom: 15px; }
.control-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #aaa; }
.control-group input[type="range"] { width: 100%; cursor: pointer; }
.control-group .value { font-size: 11px; color: #666; margin-top: 3px; }
</style>
<script type="importmap">
{
"imports": {
"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableZoom = true;
controls.enablePan = true;
camera.position.set(0, 0, 8);

let widthSegments = 48;
let heightSegments = 48;
let radius = 2.0;
let waveSpeed = 0.4;
let waveHeight = 0.3;
let noiseScale = 0.8;

let sphere;
let geometry;
let originalPositions;

function createSphere() {
    if (sphere) {
        scene.remove(sphere);
        sphere.geometry.dispose();
        sphere.material.dispose();
    }
    geometry = new THREE.SphereGeometry(radius, widthSegments, heightSegments);
    originalPositions = new Float32Array(geometry.attributes.position.array.slice());
    const material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.8 });
    sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);
}

createSphere();

const clock = new THREE.Clock();

function update(delta) {
    if (!geometry || !originalPositions) return;
    const time = clock.getElapsedTime();
    const waveSpeedVal = waveSpeed;
    const waveHeightVal = waveHeight;
    const noiseScaleVal = noiseScale;
    
    const posAttribute = geometry.attributes.position;
    for (let i = 0; i < posAttribute.count; i++) {
        const ox = originalPositions[i * 3 + 0];
        const oy = originalPositions[i * 3 + 1];
        const oz = originalPositions[i * 3 + 2];
        const len = Math.sqrt(ox * ox + oy * oy + oz * oz);
        const nx = ox / len;
        const ny = oy / len;
        const nz = oz / len;
        
        const nx_val = (ox + time * waveSpeedVal) * noiseScaleVal;
        const ny_val = (oy + time * waveSpeedVal * 0.7) * noiseScaleVal;
        const nz_val = (oz + time * waveSpeedVal * 1.3) * noiseScaleVal;
        
        const n0 = Math.sin(nx_val) + Math.sin(ny_val) + Math.sin(nz_val);
        const n1 = Math.sin(nx_val * 2.09 + 0.5) + Math.sin(ny_val * 2.09 + 0.5) + Math.sin(nz_val * 2.09 + 0.5);
        const n2 = Math.sin(nx_val * 0.333 + 1.0) + Math.sin(ny_val * 0.333 + 1.0) + Math.sin(nz_val * 0.333 + 1.0);
        const noise = 0.333 * (n0 + n1 + n2) / 3.0 + 0.5;
        const displacement = (noise - 0.5) * 2.0 * waveHeightVal;
        
        posAttribute.setXYZ(i, ox + nx * displacement, oy + ny * displacement, oz + nz * displacement);
    }
    posAttribute.needsUpdate = true;
}

function animate() {
    requestAnimationFrame(animate);
    update(clock.getDelta());
    controls.update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

const controlPanel = document.createElement('div');
controlPanel.id = 'controls';
controlPanel.style.cssText = 'position:fixed;top:20px;right:20px;background:rgba(0,0,0,0.85);padding:20px;border-radius:8px;color:#fff;min-width:200px;z-index:100;';

const controlsData = [
    { id: 'widthSegments', label: 'Width Segments', min: 4, max: 128, step: 1, value: 48 },
    { id: 'heightSegments', label: 'Height Segments', min: 4, max: 128, step: 1, value: 48 },
    { id: 'radius', label: 'Sphere Radius', min: 0.5, max: 5.0, step: 0.1, value: 2.0 },
    { id: 'waveSpeed', label: 'Wave Speed', min: 0.0, max: 3.0, step: 0.01, value: 0.4 },
    { id: 'waveHeight', label: 'Wave Height', min: 0.0, max: 1.5, step: 0.01, value: 0.3 },
    { id: 'noiseScale', label: 'Noise Scale', min: 0.1, max: 3.0, step: 0.01, value: 0.8 }
];

controlsData.forEach(cd => {
    const group = document.createElement('div');
    group.className = 'control-group';
    
    const label = document.createElement('label');
    label.textContent = cd.label;
    label.style.cssText = 'display:block;font-size:12px;margin-bottom:5px;color:#aaa;';
    
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = cd.min;
    slider.max = cd.max;
    slider.step = cd.step;
    slider.value = cd.value;
    slider.style.cssText = 'width:100%;cursor:pointer;';
    
    const valueDiv = document.createElement('div');
    valueDiv.className = 'value';
    valueDiv.id = cd.id + '-val';
    valueDiv.textContent = cd.value;
    valueDiv.style.cssText = 'font-size:11px;color:#666;margin-top:3px;';
    
    slider.addEventListener('input', () => {
        const val = parseFloat(slider.value);
        valueDiv.textContent = val.toFixed(cd.step < 0.1 ? 2 : cd.step < 1 ? 1 : 0);
        switch(cd.id) {
            case 'widthSegments': widthSegments = Math.round(val); break;
            case 'heightSegments': heightSegments = Math.round(val); break;
            case 'radius': radius = val; break;
            case 'waveSpeed': waveSpeed = val; break;
            case 'waveHeight': waveHeight = val; break;
            case 'noiseScale': noiseScale = val; break;
        }
        console.log('Updated', cd.id, ':', val);
        createSphere();
    });
    
    group.appendChild(label);
    group.appendChild(slider);
    group.appendChild(valueDiv);
    controlPanel.appendChild(group);
});

document.body.appendChild(controlPanel);
</script>
</body>
</html>
