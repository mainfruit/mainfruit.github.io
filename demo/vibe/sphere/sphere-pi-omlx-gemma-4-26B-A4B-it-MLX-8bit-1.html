<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Wireframe Lava Sphere</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';
        import { FilmShader } from 'three/addons/shaders/FilmShader.js';

        // --- CONFIG & STATE ---
        const params = {
            // Sphere / Noise
            noiseAmplitude: 0.25,
            noiseScale: 0.8,
            noiseSpeed: 0.5,
            
            // Post FX
            bloomStrength: 1.5,
            bloomRadius: 0.4,
            bloomThreshold: 0.1,
            rgbShiftAmount: 0.003,
            filmNoise: 0.3,
            filmScanline: 0.4,

            // Misc
            autoRotate: true,
            autoRotateSpeed: 0.5
        };

        // --- SHADERS ---
        const vertexShader = `
            uniform float uTime;
            uniform float uNoiseScale;
            uniform float uNoiseAmplitude;

            varying vec3 vNormal;
            varying vec3 vPosition;

            // Simplex 3D Noise
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute(
                         i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                       + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                       + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vNormal = normal;
                vPosition = position;
                
                float noise = snoise(position * uNoiseScale + uTime);
                vec3 newPosition = position + normal * noise * uNoiseAmplitude;
                
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }
        `;

        const fragmentShader = `
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                gl_FragColor = vec4(1.0, 1.0, 1.0, 1.0);
            }
        `;

        // --- MAIN SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Sphere
        const geometry = new THREE.IcosahedronGeometry(2, 32);
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uNoiseScale: { value: params.noiseScale },
                uNoiseAmplitude: { value: params.noiseAmplitude }
            },
            wireframe: true
        });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Postprocessing
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.1);
        bloomPass.strength = params.bloomStrength;
        bloomPass.radius = params.bloomRadius;
        bloomPass.threshold = params.bloomThreshold;
        composer.addPass(bloomPass);

        const rgbShiftPass = new ShaderPass(RGBShiftShader);
        if (rgbShiftPass.uniforms && rgbShiftPass.uniforms.amount) {
            rgbShiftPass.uniforms.amount.value = params.rgbShiftAmount;
        }
        composer.addPass(rgbShiftPass);

        const filmPass = new ShaderPass(FilmShader);
        if (filmPass.uniforms) {
            if (filmPass.uniforms.nIntensity) filmPass.uniforms.nIntensity.value = params.filmNoise;
            if (filmPass.uniforms.nPan) filmPass.uniforms.nPan.value = 0.005;
            if (filmPass.uniforms.fStrength) filmPass.uniforms.fStrength.value = params.filmScanline;
        }
        composer.addPass(filmPass);

        // --- GUI ---
        const gui = new lil.GUI();
        const sphereFolder = gui.addFolder('Sphere / Noise');
        sphereFolder.add(params, 'noiseAmplitude', 0, 1.0).onChange(v => {
            if (material.uniforms && material.uniforms.uNoiseAmplitude) {
                material.uniforms.uNoiseAmplitude.value = v;
            }
        });
        sphereFolder.add(params, 'noiseScale', 0.1, 3.0).onChange(v => {
            if (material.uniforms && material.uniforms.uNoiseScale) {
                material.uniforms.uNoiseScale.value = v;
            }
        });
        sphereFolder.add(params, 'noiseSpeed', 0, 2.0);

        const fxFolder = gui.addFolder('Post FX');
        fxFolder.add(params, 'bloomStrength', 0, 3.0).onChange(v => {
            if (bloomPass) bloomPass.strength = v;
        });
        fxFolder.add(params, 'bloomRadius', 0, 1.0).onChange(v => {
            if (bloomPass) bloomPass.radius = v;
        });
        fxFolder.add(params, 'bloomThreshold', 0, 1.0).onChange(v => {
            if (bloomPass) bloomPass.threshold = v;
        });
        fxFolder.add(params, 'rgbShiftAmount', 0, 0.05).onChange(v => {
            if (rgbShiftPass.uniforms && rgbShiftPass.uniforms.amount) {
                rgbShiftPass.uniforms.amount.value = v;
            }
        });
        fxFolder.add(params, 'filmNoise', 0, 1.0).onChange(v => {
            if (filmPass.uniforms && filmPass.uniforms.nIntensity) {
                filmPass.uniforms.nIntensity.value = v;
            }
        });
        fxFolder.add(params, 'filmScanline', 0, 1.0).onChange(v => {
            if (filmPass.uniforms && filmPass.uniforms.fStrength) {
                filmPass.uniforms.fStrength.value = v;
            }
        });

        const miscFolder = gui.addFolder('Misc');
        miscFolder.add(params, 'autoRotate');
        miscFolder.add(params, 'autoRotateSpeed', 0, 2.0);

        gui.domElement.style.display = 'none';

        // --- EVENTS ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'd') {
                const currentDisplay = gui.domElement.style.display;
                gui.domElement.style.display = currentDisplay === 'none' ? '' : 'none';
            }
        });

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            // Update Sphere
            material.uniforms.uTime.value = elapsed * params.noiseSpeed;
            
            if (params.autoRotate) {
                sphere.rotation.y += delta * params.autoRotateSpeed;
                sphere.rotation.x += delta * (params.autoRotateSpeed * 0.5);
            }

            controls.update();
            composer.render();
        }

        animate();
    </script>
</body>
</html>
