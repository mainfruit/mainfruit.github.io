<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Wireframe Lava Sphere</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';
        import { FilmShader } from 'three/addons/shaders/FilmShader.js';

        // --- CONFIG & STATE ---
        const params = {
            // Blob / Noise
            noiseAmplitude: 0.25,
            noiseScale: 0.8,
            noiseSpeed: 0.5,
            blobCount: 6,
            blobSpeed: 1.0,
            blobScale: 1.0,
            attraction: 0.2,
            absorptionRate: 0.05,
            
            // Post FX
            bloomStrength: 1.5,
            bloomRadius: 0.4,
            bloomThreshold: 0.1,
            rgbShiftAmount: 0.003,
            filmNoise: 0.3,
            filmScanline: 0.4,
            tvDistortion: 0.15,

            // Misc
            autoRotate: true,
            autoRotateSpeed: 0.5
        };

        // --- SHADERS ---
        const vertexShader = `
            uniform float uTime;
            uniform float uNoiseScale;
            uniform float uNoiseAmplitude;
            uniform vec3 uCenters[16];
            uniform float uRadii[16];

            varying vec3 vNormal;
            varying vec3 vPosition;

            // Simplex 3D Noise
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute(
                         i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                       + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                       + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            float sdSphere(vec3 p, float s) {
                return length(p) - s;
            }

            float smin(float a, float b, float k) {
                float h = max(k - abs(a - b), 0.0) / k;
                return min(a, b) - h * h * k * (1.0 / 4.0);
            }

            void main() {
                vNormal = normal;
                vPosition = position;
                
                // Calculate SDF of multiple spheres with smooth minimum
                float d = sdSphere(position - uCenters[0], uRadii[0]);
                for(int i = 1; i < 16; i++) {
                    d = smin(d, sdSphere(position - uCenters[i], uRadii[i]), 0.4);
                }

                // Add noise to the distance field for a more organic look
                float noise = snoise(position * uNoiseScale + uTime) * uNoiseAmplitude;
                d += noise;

                // Displace the vertex towards the SDF surface
                // Using the mesh's normal as a direction vector for displacement
                // Pull vertices towards the surface defined by the SDF
                vec3 newPosition = position - d * normal;
                
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }
        `;

        const fragmentShader = `
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                gl_FragColor = vec4(1.0, 1.0, 1.0, 1.0);
            }
        `;

        // --- MAIN SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Single high-density sphere acting as the "canvas" for the blobs
        const geometry = new THREE.IcosahedronGeometry(10, 64);
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uNoiseScale: { value: params.noiseScale },
                uNoiseAmplitude: { value: params.noiseAmplitude },
                uCenters: { value: new Float32Array(6 * 3) },
                uRadii: { value: new Float32Array(6) }
            },
            wireframe: true
        });
        
        const blobMesh = new THREE.Mesh(geometry, material);
        scene.add(blobMesh);

        // Blob data
        const massCount = params.blobCount;
        const blobs = [];
        function createBlobs(count) {
            blobs.length = 0;
            for (let i = 0; i < count; i++) {
                const radius = (1.5 + Math.random() * 1.5) * params.blobScale;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const dist = 2 + Math.random() * 3;
                
                const pos = new THREE.Vector3(
                    dist * Math.sin(phi) * Math.cos(theta),
                    dist * Math.sin(phi) * Math.sin(theta),
                    dist * Math.cos(phi)
                );

                blobs.push({
                    position: pos,
                    radius: radius,
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.1 * params.blobSpeed,
                        (Math.random() - 0.5) * 0.1 * params.blobSpeed,
                        (Math.random() - 0.5) * 0.1 * params.blobSpeed
                    ),
                    noiseOffset: Math.random() * 1000,
                    scaleSpeed: 0.2 + Math.random() * 0.5,
                    baseRadius: radius
                });
            }
        }
        createBlobs(massCount);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Postprocessing
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // 1. Custom Film Pass (Grain + Scanlines)
        const filmPass = new ShaderPass({
            uniforms: {
                tDiffuse: { value: null },
                time: { value: 0.0 },
                noiseIntensity: { value: params.filmNoise },
                scanlineStrength: { value: params.filmScanline }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float time;
                uniform float noiseIntensity;
                uniform float scanlineStrength;
                varying vec2 vUv;

                float rand(vec2 co){
                    return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
                }

                void main() {
                    vec4 texel = texture2D(tDiffuse, vUv);
                    float noise = (rand(vUv + time) - 0.5) * noiseIntensity;
                    float scanline = sin(vUv.y * 800.0 + time * 10.0) * scanlineStrength * 0.1;
                    gl_FragColor = texel + vec4(vec3(noise + scanline), 0.0);
                }
            `
        });
        composer.addPass(filmPass);

        // 2. RGB Shift
        const rgbShiftPass = new ShaderPass(RGBShiftShader);
        if (rgbShiftPass.uniforms && rgbShiftPass.uniforms.amount) {
            rgbShiftPass.uniforms.amount.value = params.rgbShiftAmount;
        }
        composer.addPass(rgbShiftPass);

        // 3. CRT Distortion
        const distortionPass = new ShaderPass({
            uniforms: {
                tDiffuse: { value: null },
                uDistortion: { value: params.tvDistortion }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uDistortion;
                varying vec2 vUv;

                void main() {
                    vec2 uv = vUv - 0.5;
                    float r2 = dot(uv, uv);
                    uv *= (1.0 + uDistortion * r2);
                    uv += 0.5;

                    if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
                        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                    } else {
                        gl_FragColor = texture2D(tDiffuse, uv);
                    }
                }
            `
        });
        composer.addPass(distortionPass);

        // 4. Bloom Pass
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.1);
        bloomPass.strength = params.bloomStrength;
        bloomPass.radius = params.bloomRadius;
        bloomPass.threshold = params.bloomThreshold;
        composer.addPass(bloomPass);

        // --- GUI ---
        const gui = new lil.GUI();
        const blobFolder = gui.addFolder('Blob / Noise');
        blobFolder.add(params, 'noiseAmplitude', 0, 1.0).onChange(v => {
            if (material.uniforms && material.uniforms.uNoiseAmplitude) material.uniforms.uNoiseAmplitude.value = v;
        });
        blobFolder.add(params, 'noiseScale', 0.1, 3.0).onChange(v => {
            if (material.uniforms && material.uniforms.uNoiseScale) material.uniforms.uNoiseScale.value = v;
        });
        blobFolder.add(params, 'noiseSpeed', 0, 2.0);
        
        const massFolder = gui.addFolder('Masses');
        massFolder.add(params, 'blobCount', 1, 16, 1).onChange(v => {
            createBlobs(v);
        });
        massFolder.add(params, 'blobSpeed', 0, 5.0).onChange(v => {
            blobs.forEach(b => {
                b.velocity.multiplyScalar(v / (b.velocity.length() || 1));
            });
        });
        massFolder.add(params, 'blobScale', 0.1, 3.0).onChange(v => {
            blobs.forEach(b => {
                b.baseRadius = (1.5 + Math.random() * 1.5) * v;
                b.radius = b.baseRadius;
            });
        });
        massFolder.add(params, 'attraction', 0, 1.0);
        massFolder.add(params, 'absorptionRate', 0, 0.2);

        const fxFolder = gui.addFolder('Post FX');
        fxFolder.add(params, 'bloomStrength', 0, 3.0).onChange(v => {
            if (bloomPass) bloomPass.strength = v;
        });
        fxFolder.add(params, 'bloomRadius', 0, 1.0).onChange(v => {
            if (bloomPass) bloomPass.radius = v;
        });
        fxFolder.add(params, 'bloomThreshold', 0, 1.0).onChange(v => {
            if (bloomPass) bloomPass.threshold = v;
        });
        fxFolder.add(params, 'rgbShiftAmount', 0, 0.05).onChange(v => {
            if (rgbShiftPass.uniforms && rgbShiftPass.uniforms.amount) rgbShiftPass.uniforms.amount.value = v;
        });
        fxFolder.add(params, 'filmNoise', 0, 1.0).onChange(v => {
            if (filmPass.uniforms && filmPass.uniforms.noiseIntensity) filmPass.uniforms.noiseIntensity.value = v;
        });
        fxFolder.add(params, 'filmScanline', 0, 1.0).onChange(v => {
            if (filmPass.uniforms && filmPass.uniforms.scanlineStrength) filmPass.uniforms.scanlineStrength.value = v;
        });
        fxFolder.add(params, 'tvDistortion', -0.5, 0.5).onChange(v => {
            if (distortionPass.uniforms && distortionPass.uniforms.uDistortion) distortionPass.uniforms.uDistortion.value = v;
        });

        const miscFolder = gui.addFolder('Misc');
        miscFolder.add(params, 'autoRotate');
        miscFolder.add(params, 'autoRotateSpeed', 0, 2.0);

        gui.domElement.style.display = 'none';

        // --- EVENTS ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'd') {
                const currentDisplay = gui.domElement.style.display;
                gui.domElement.style.display = currentDisplay === 'none' ? '' : 'none';
            }
        });

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            // Update Blob Data and pass to Shader
            const centerArray = new Float32Array(params.blobCount * 3);
            const radiusArray = new Float32Array(params.blobCount);

            blobs.forEach((blob, i) => {
                if (i >= params.blobCount) return;

                // Attraction to center
                if (params.attraction > 0) {
                    const pull = blob.position.clone().normalize().multiplyScalar(-params.attraction * delta);
                    blob.velocity.add(pull);
                }

                // Movement
                blob.position.add(blob.velocity.clone().multiplyScalar(delta * 10));
                
                // Boundary check
                const dist = blob.position.length();
                if (dist > 7 || dist < 1.5) {
                    blob.velocity.negate().multiplyScalar(0.9);
                }

                // Absorption (growth)
                blob.baseRadius += params.absorptionRate * delta;
                // Cap growth to avoid overflowing the whole scene
                if (blob.baseRadius > 5.0) blob.baseRadius = 5.0;

                // Pulsating radius (melting)
                const scaleMod = 1.0 + Math.sin(elapsed * blob.scaleSpeed + blob.noiseOffset) * 0.4;
                blob.currentRadius = blob.baseRadius * scaleMod;

                centerArray[i * 3 + 0] = blob.position.x;
                centerArray[i * 3 + 1] = blob.position.y;
                centerArray[i * 3 + 2] = blob.position.z;
                radiusArray[i] = blob.currentRadius;
            });

            // Update Material Uniforms
            material.uniforms.uTime.value = elapsed * params.noiseSpeed;
            material.uniforms.uCenters.value = centerArray;
            material.uniforms.uRadii.value = radiusArray;
            
            // Update Film Pass Time
            if (filmPass.uniforms && filmPass.uniforms.time) {
                filmPass.uniforms.time.value = elapsed;
            }
            
            if (params.autoRotate) {
                blobMesh.rotation.y += delta * params.autoRotateSpeed;
                blobMesh.rotation.x += delta * (params.autoRotateSpeed * 0.5);
            }

            controls.update();
            composer.render();
        }

        animate();
    </script>
</body>
</html>
