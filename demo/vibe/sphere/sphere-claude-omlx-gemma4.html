<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Sphere Artwork</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<!-- Load lil-gui via UMD -->
<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>

<!-- Import map for Three.js modules -->
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';
import { FilmShader } from 'three/addons/shaders/FilmShader.js';

/**
 * GLSL Simplex Noise implementation for vertex displacement
 */
const noiseVertexShader = `
    varying vec2 vUv;
    varying vec3 vNormal;

    uniform float uTime;
    uniform float uNoiseAmplitude;
    uniform float uNoiseScale;
    uniform float uNoiseSpeed;

    // Simplex 3D Noise
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

    float snoise(vec3 v){
        const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
        const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);

        vec3 i  = floor(v + dot(v, C.yyy) );
        vec3 x0 =   v - i + dot(i, C.xxx) ;

        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min( g.xyz, l.zxy );
        vec3 i2 = max( g.xyz, l.zxy );

        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;

        i = mod(i, 289.0);
        vec4 p = permute( permute( permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));

        float n_ = 1.0/7.0;
        vec3  ns = n_ * D.wyz - D.xzx;

        vec4 j = p - 49.0 * floor(p * ns.z *ns.z);

        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_ );

        vec4 x = x_ *ns.x + ns.yyyy;
        vec4 y = y_ *ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);

        vec4 b0 = vec4( x.xy, y.xy );
        vec4 b1 = vec4( x.zw, y.zw );

        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));

        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;

        vec3 p0 = vec3(a0.xy,h.x);
        vec3 p1 = vec3(a0.zw,h.y);
        vec3 p2 = vec3(a1.xy,h.z);
        vec3 p3 = vec3(a1.zw,h.w);

        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;

        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
    }

    void main() {
        vUv = uv;
        vNormal = normal;

        vec3 pos = position;
        float noise = snoise(vec3(pos * uNoiseScale + uTime * uNoiseSpeed));
        pos += normal * noise * uNoiseAmplitude;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
`;

const noiseFragmentShader = `
    varying vec2 vUv;
    varying vec3 vNormal;

    void main() {
        // Simple off-white color for the wireframe
        gl_FragColor = vec4(0.9, 0.9, 0.9, 1.0);
    }
`;

/**
 * Main Application Class
 */
class Artwork {
    constructor() {
        this.params = {
            // Sphere / Noise
            noiseAmplitude: 0.3,
            noiseScale: 0.6,
            noiseSpeed: 0.4,
            // Post FX
            bloomStrength: 1.2,
            bloomRadius: 0.4,
            bloomThreshold: 0.1,
            rgbShift: 0.002,
            filmNoise: 0.5,
            filmScanline: 0.4,
            // Misc
            autoRotate: true,
            autoRotateSpeed: 0.5
        };

        this.initScene();
        this.initLights();
        this.initSphere();
        this.initPostProcessing();
        this.initControls();
        this.initGUI();
        this.addEventListeners();
        this.animate();
    }

    initScene() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x000000);

        this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.camera.position.z = 12;

        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(this.renderer.domElement);
    }

    initLights() {
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        this.scene.add(ambientLight);
    }

    initSphere() {
        const geometry = new THREE.SphereGeometry(5, 64, 64);

        this.sphereMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uNoiseAmplitude: { value: this.params.noiseAmplitude },
                uNoiseScale: { value: this.params.noiseScale },
                uNoiseSpeed: { value: this.params.noiseSpeed }
            },
            vertexShader: noiseVertexShader,
            fragmentShader: noiseFragmentShader,
            wireframe: true
        });

        this.sphere = new THREE.Mesh(geometry, this.sphereMaterial);
        this.scene.add(this.sphere);
    }

    initPostProcessing() {
        this.composer = new EffectComposer(this.renderer);

        // 1. Render Pass
        const renderPass = new RenderPass(this.scene, this.camera);
        this.composer.addPass(renderPass);

        // 2. Bloom Pass
        this.bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            this.params.bloomStrength,
            this.params.bloomRadius,
            this.params.bloomThreshold
        );
        this.composer.addPass(this.bloomPass);

        // 3. RGB Shift Pass
        this.rgbShiftPass = new ShaderPass(RGBShiftShader);
        if (this.rgbShiftPass.uniforms && this.rgbShiftPass.uniforms['amount']) {
            this.rgbShiftPass.uniforms['amount'].value = this.params.rgbShift;
        }
        this.composer.addPass(this.rgbShiftPass);

        // 4. Film Pass
        this.filmPass = new ShaderPass(FilmShader);
        if (this.filmPass.uniforms && this.filmPass.uniforms['amount']) {
            this.filmPass.uniforms['amount'].value = this.params.filmNoise;
        }
        if (this.filmPass.uniforms && this.filmPass.uniforms['scanlineIntensity']) {
            this.filmPass.uniforms['scanlineIntensity'].value = this.params.filmScanline;
        }
        this.composer.addPass(this.filmPass);
    }

    initControls() {
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
    }

    initGUI() {
        this.gui = new lil.GUI();
        this.gui.domElement.style.display = 'none';
        this.gui.position = 'topright';

        const noiseFolder = this.gui.addFolder('Sphere / Noise');
        noiseFolder.add(this.params, 'noiseAmplitude', 0, 1).onChange(v => this.sphereMaterial.uniforms.uNoiseAmplitude.value = v);
        noiseFolder.add(this.params, 'noiseScale', 0.1, 2.0).onChange(v => this.sphereMaterial.uniforms.uNoiseScale.value = v);
        noiseFolder.add(this.params, 'noiseSpeed', 0, 2.0).onChange(v => this.sphereMaterial.uniforms.uNoiseSpeed.value = v);

        const fxFolder = this.gui.addFolder('Post FX');
        fxFolder.add(this.params, 'bloomStrength', 0, 3).onChange(v => this.bloomPass.strength = v);
        fxFolder.add(this.params, 'bloomRadius', 0, 1).onChange(v => this.bloomPass.radius = v);
        fxFolder.add(this.params, 'bloomThreshold', 0, 1).onChange(v => this.bloomPass.threshold = v);
        fxFolder.add(this.params, 'rgbShift', 0, 0.01).onChange(v => {
            if (this.rgbShiftPass.uniforms && this.rgbShiftPass.uniforms['amount']) {
                this.rgbShiftPass.uniforms['amount'].value = v;
            }
        });
        fxFolder.add(this.params, 'filmNoise', 0, 1).onChange(v => {
            if (this.filmPass.uniforms && this.filmPass.uniforms['amount']) {
                this.filmPass.uniforms['amount'].value = v;
            }
        });
        fxFolder.add(this.params, 'filmScanline', 0, 1).onChange(v => {
            if (this.filmPass.uniforms && this.filmPass.uniforms['scanlineIntensity']) {
                this.filmPass.uniforms['scanlineIntensity'].value = v;
            }
        });

        const miscFolder = this.gui.addFolder('Misc');
        miscFolder.add(this.params, 'autoRotate');
        miscFolder.add(this.params, 'autoRotateSpeed', 0, 2);

        this.gui.open();
    }

    addEventListeners() {
        window.addEventListener('resize', () => this.onResize());
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'd') {
                const display = this.gui.domElement.style.display;
                this.gui.domElement.style.display = display === 'none' ? 'block' : 'none';
            }
        });
    }

    onResize() {
        const width = window.innerWidth;
        const height = window.innerHeight;

        this.camera.aspect = width / height;
        this.camera.updateProjectionMatrix();

        this.renderer.setSize(width, height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        this.composer.setSize(width, height);
    }

    animate() {
        requestAnimationFrame(() => this.animate());

        const time = performance.now() * 0.001;
        this.sphereMaterial.uniforms.uTime.value = time;

        if (this.params.autoRotate) {
            this.sphere.rotation.y += 0.005 * this.params.autoRotateSpeed;
            this.sphere.rotation.x += 0.002 * this.params.autoRotateSpeed;
        }

        this.controls.update();
        this.composer.render();
    }
}

// Start the artwork
new Artwork();

</script>
</body>
</html>
