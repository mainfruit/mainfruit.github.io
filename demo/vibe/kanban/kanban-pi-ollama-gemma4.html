<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Kanban Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 
         * CSS VARIABLES & THEME 
         */
        :root {
            --bg-color: #0f1117;
            --panel-bg: rgba(30, 34, 45, 0.6);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f0f2f5;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --low-priority: #10b981;
            --medium-priority: #f59e0b;
            --high-priority: #ef4444;
            
            --glass-blur: blur(12px);
            --transition-speed: 0.2s;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 
         * LAYOUT 
         */
        header {
            padding: 1.5rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            background: rgba(15, 17, 23, 0.8);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--panel-border);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-input, .filter-select {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            outline: none;
            font-size: 0.875rem;
        }

        .search-input:focus, .filter-select:focus {
            border-color: var(--accent-color);
        }

        main#board {
            flex: 1;
            display: flex;
            padding: 2rem;
            gap: 1.5rem;
            overflow-x: auto;
            align-items: flex-start;
            min-height: calc(100vh - 160px);
        }

        /* 
         * COLUMNS 
         */
        .column {
            flex: 0 0 320px;
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 160px);
            position: relative;
            transition: box-shadow var(--transition-speed) ease, transform var(--transition-speed) ease;
        }

        .column.drag-over {
            box-shadow: 0 0 0 3px var(--accent-color);
            transform: scale(1.01);
        }

        .column-header {
            padding: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: text;
        }

        .column-title {
            font-weight: 600;
            font-size: 1rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .column-actions {
            opacity: 0;
            transition: opacity var(--transition-speed);
            display: flex;
            gap: 0.5rem;
        }

        .column:hover .column-actions {
            opacity: 1;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }

        .btn-icon:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .cards-container {
            padding: 0 1rem 1rem 1rem;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .add-column-btn {
            margin: 0 2rem 2rem 2rem;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--panel-border);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: all var(--transition-speed);
        }

        .add-column-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        /* 
         * CARDS 
         */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1rem;
            position: relative;
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s, filter 0.3s;
            user-select: none;
        }

        .card:active {
            cursor: grabbing;
        }

        .card.dragging {
            opacity: 0.4;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-shadow);
            background: rgba(255, 255, 255, 0.06);
        }

        .card.in-done {
            opacity: 0.7;
            filter: grayscale(0.4);
        }

        .card.in-done .card-title {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .card-desc.collapsed {
            display: none;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .priority-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
        }

        .priority-low { background: rgba(16, 185, 129, 0.2); color: var(--low-priority); }
        .priority-medium { background: rgba(245, 158, 11, 0.2); color: var(--medium-priority); }
        .priority-high { background: rgba(239, 68, 68, 0.2); color: var(--high-priority); }

        .due-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .due-date.overdue {
            color: var(--danger);
            font-weight: 600;
        }

        .card-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover .card-actions {
            opacity: 1;
        }

        .fade-out {
            opacity: 0;
            transform: scale(0.9);
        }

        /* 
         * FORMS 
         */
        .card-form {
            background: rgba(15, 17, 23, 0.95);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-form input, .card-form select, .card-form textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            padding: 0.5rem;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.875rem;
        }

        .card-form textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.875rem;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }

        .btn-primary { background: var(--accent-color); color: white; }
        .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--panel-border); }
        
        .add-card-btn {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: none;
            border: 1px dashed var(--panel-border);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .add-card-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        /* 
         * FILTERING 
         */
        .card.hidden {
            visibility: hidden; /* Keeps the space/gap */
        }

        /* 
         * STATS BAR 
         */
        .stats-bar {
            height: 50px;
            background: rgba(15, 17, 23, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .stat-item span {
            color: var(--text-primary);
            font-weight: 700;
            margin-left: 4px;
        }

        .stat-item.overdue span { color: var(--danger); }
        .stat-item.done span { color: var(--success); }

        /* 
         * RESPONSIVE 
         */
        @media (max-width: 768px) {
            header { flex-direction: column; align-items: stretch; }
            .controls { flex-direction: column; align-items: stretch; }
            .stats-bar { gap: 1rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Pro Kanban</h1>
        <div class="controls">
            <input type="text" id="searchBar" class="search-input" placeholder="Search tasks...">
            <select id="priorityFilter" class="filter-select">
                <option value="All">All Priorities</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
        </div>
    </header>

    <main id="board">
        <!-- Columns will be injected here -->
    </main>

    <div class="stats-bar" id="statsBar">
        <div class="stat-item">Total: <span id="statTotal">0</span></div>
        <div class="stat-item overdue">Overdue: <span id="statOverdue">0</span></div>
        <div class="stat-item done">Done: <span id="statDone">0</span></div>
        <div class="stat-item">Completion: <span id="statRate">0%</span></div>
    </div>

    <script>
        /**
         * STATE MANAGEMENT
         */
        let state = {
            columns: []
        };

        const DEFAULT_COLUMNS = ['Backlog', 'To Do', 'In Progress', 'Done'];
        const EXAMPLE_CARDS = [
            { id: 'ex1', title: 'Setup project structure', description: 'Initialize git and folder organization', priority: 'High', dueDate: '2023-01-01', done: true },
            { id: 'ex2', title: 'Research UI trends', description: 'Look for glassmorphism inspiration', priority: 'Medium', dueDate: '2025-12-31', done: false },
            { id: 'ex3', title: 'Implement drag & drop', description: 'Use native HTML5 API', priority: 'High', dueDate: '2024-05-20', done: false },
            { id: 'ex4', title: 'Write documentation', description: '', priority: 'Low', dueDate: '2026-01-01', done: false }
        ];

        /**
         * CORE FUNCTIONS
         */

        function init() {
            const saved = localStorage.getItem('kanban_state');
            if (saved) {
                state = JSON.parse(saved);
            } else {
                // Create default columns
                state.columns = DEFAULT_COLUMNS.map((title, idx) => ({
                    id: `col-${Date.now()}-${idx}`,
                    title: title,
                    cards: idx === 3 ? [EXAMPLE_CARDS[0]] : (idx === 0 ? [EXAMPLE_CARDS[1]] : [])
                }));
                // Add more examples if needed
                state.columns[1].cards.push(EXAMPLE_CARDS[2]);
                state.columns[2].cards.push(EXAMPLE_CARDS[3]);
                saveState();
            }

            renderBoard();
            setupEventListeners();
            updateStats();
        }

        function saveState() {
            localStorage.setItem('kanban_state', JSON.stringify(state));
            updateStats();
        }

        /**
         * RENDERING ENGINE
         */

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            state.columns.forEach(column => {
                const colEl = document.createElement('div');
                colEl.className = 'column';
                colEl.dataset.id = column.id;
                colEl.innerHTML = `
                    <div class="column-header">
                        <div class="column-title" ondblclick="renameColumn('${column.id}')">${column.title}</div>
                        <div class="column-actions">
                            <button class="btn-icon delete-col" onclick="deleteColumn('${column.id}')" title="Delete column">🗑️</button>
                        </div>
                    </div>
                    <div class="cards-container" data-column-id="${column.id}"></div>
                    <button class="add-card-btn" onclick="showCardForm('${column.id}')">+ Add card</button>
                `;

                const container = colEl.querySelector('.cards-container');
                
                column.cards.forEach(card => {
                    const cardEl = createCardElement(card, column.id);
                    container.appendChild(cardEl);
                });

                board.appendChild(colEl);
            });

            // Add "Add Column" button
            const addColBtn = document.createElement('button');
            addColBtn.className = 'add-column-btn';
            addColBtn.innerText = '＋ Add Column';
            addColBtn.onclick = addColumn;
            board.appendChild(addColBtn);

            setupDragAndDrop();
            applyFilters();
        }

        function createCardElement(card, columnId) {
            const el = document.createElement('div');
            el.className = `card ${card.done ? 'in-done' : ''}`;
            el.draggable = true;
            el.dataset.id = card.id;
            el.dataset.columnId = columnId;

            const isOverdue = card.dueDate && new Date(card.dueDate) < new Date().setHours(0,0,0,0) && !card.done;
            const overdueClass = isOverdue ? 'overdue' : '';
            const overdueIcon = isOverdue ? '⚠️ ' : '';

            el.innerHTML = `
                <div class="card-actions">
                    <button class="btn-icon card-edit" onclick="showCardForm('${columnId}', '${card.id}')">✏️</button>
                    <button class="btn-icon card-delete" onclick="deleteCard('${columnId}', '${card.id}')">✕</button>
                </div>
                <span class="card-title">${card.title}</span>
                <div class="card-desc ${card.description ? '' : 'collapsed'}" onclick="toggleDesc(this)">
                    ${card.description || '<i style="opacity: 0.5">No description</i>'}
                </div>
                <div class="card-footer">
                    <span class="priority-badge priority-${card.priority.toLowerCase()}">${card.priority}</span>
                    <span class="due-date ${overdueClass}">
                        ${overdueIcon}${card.dueDate ? formatDate(card.dueDate) : ''}
                    </span>
                </div>
            `;

            el.addEventListener('dragstart', handleDragStart);
            el.addEventListener('dragend', handleDragEnd);

            return el;
        }

        function formatDate(dateStr) {
            const options = { month: 'short', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString(undefined, options);
        }

        /**
         * EVENT HANDLERS (ACTIONS)
         */

        function addColumn() {
            const title = prompt("Enter column name:");
            if (title) {
                state.columns.push({
                    id: `col-${Date.now()}`,
                    title: title,
                    cards: []
                });
                saveState();
                renderBoard();
            }
        }

        function renameColumn(colId) {
            const col = state.columns.find(c => c.id === colId);
            if (!col) return;
            const newTitle = prompt("Rename column:", col.title);
            if (newTitle) {
                col.title = newTitle;
                saveState();
                renderBoard();
            }
        }

        function deleteColumn(colId) {
            const col = state.columns.find(c => c.id === colId);
            if (!col) return;
            if (col.cards.length > 0) {
                alert("Cannot delete a column that contains cards.");
                return;
            }
            state.columns = state.columns.filter(c => c.id !== colId);
            saveState();
            renderBoard();
        }

        function showCardForm(colId, cardId = null) {
            const container = document.querySelector(`.column[data-id="${colId}"] .cards-container`);
            const form = document.createElement('div');
            form.className = 'card-form';

            let titleVal = '', descVal = '', priorityVal = 'Medium', dateVal = '';

            if (cardId) {
                const col = state.columns.find(c => c.id === colId);
                const card = col.cards.find(c => c.id === cardId);
                if (card) {
                    titleVal = card.title;
                    descVal = card.description || '';
                    priorityVal = card.priority;
                    dateVal = card.dueDate || '';
                }
            }

            form.innerHTML = `
                <input type="text" id="f-title" placeholder="Card title (required)..." required value="${titleVal}">
                <select id="f-priority">
                    <option value="Low" ${priorityVal === 'Low' ? 'selected' : ''}>Low</option>
                    <option value="Medium" ${priorityVal === 'Medium' ? 'selected' : ''}>Medium</option>
                    <option value="High" ${priorityVal === 'High' ? 'selected' : ''}>High</option>
                </select>
                <input type="date" id="f-date" value="${dateVal}">
                <textarea id="f-desc" placeholder="Description (optional)...">${descVal}</textarea>
                <div class="form-actions">
                    <button class="btn btn-ghost" onclick="this.parentElement.parentElement.remove()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveCard('${colId}', '${cardId || ''}')">${cardId ? 'Update' : 'Save'}</button>
                </div>
            `;
            container.prepend(form);
            form.querySelector('#f-title').focus();
        }

        function saveCard(colId, cardId) {
            const title = document.getElementById('f-title').value;
            if (!title) {
                alert("Title is required");
                return;
            }

            const col = state.columns.find(c => c.id === colId);

            if (cardId) {
                const card = col.cards.find(c => c.id === cardId);
                if (card) {
                    card.title = title;
                    card.priority = document.getElementById('f-priority').value;
                    card.dueDate = document.getElementById('f-date').value;
                    card.description = document.getElementById('f-desc').value;
                }
            } else {
                const card = {
                    id: `card-${Date.now()}`,
                    title: title,
                    priority: document.getElementById('f-priority').value,
                    dueDate: document.getElementById('f-date').value,
                    description: document.getElementById('f-desc').value,
                    done: false
                };
                col.cards.push(card);
            }

            saveState();
            renderBoard();
        }

        function deleteCard(colId, cardId) {
            const col = state.columns.find(c => c.id === colId);
            const cardEl = document.querySelector(`.card[data-id="${cardId}"]`);
            if (!cardEl) return;

            cardEl.classList.add('fade-out');
            
            setTimeout(() => {
                col.cards = col.cards.filter(c => c.id !== cardId);
                saveState();
                renderBoard();
            }, 300);
        }

        function toggleDesc(el) {
            el.classList.toggle('collapsed');
        }

        /**
         * DRAG AND DROP LOGIC
         */
        let draggedCardId = null;
        let sourceColId = null;

        function handleDragStart(e) {
            draggedCardId = e.target.dataset.id;
            sourceColId = e.target.dataset.columnId;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            // Required for some browsers
            e.dataTransfer.setData('text/plain', draggedCardId);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
        }

        function setupDragAndDrop() {
            const columns = document.querySelectorAll('.column');

            columns.forEach(col => {
                col.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    col.classList.add('drag-over');
                });

                col.addEventListener('dragleave', (e) => {
                    col.classList.remove('drag-over');
                });

                col.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const targetColId = col.dataset.id;
                    if (targetColId === sourceColId) return;

                    moveCard(sourceColId, targetColId, draggedCardId);
                });
            });
        }

        function moveCard(fromColId, toColId, cardId) {
            const fromCol = state.columns.find(c => c.id === fromColId);
            const toCol = state.columns.find(c => c.id === toColId);
            if (!fromCol || !toCol) return;

            const cardIdx = fromCol.cards.findIndex(c => c.id === cardId);
            if (cardIdx === -1) return;

            const [card] = fromCol.cards.splice(cardIdx, 1);

            // Update "done" status if moved to Done column
            if (toCol.title.toLowerCase() === 'done') {
                card.done = true;
            } else {
                card.done = false;
            }

            toCol.cards.push(card);
            saveState();
            renderBoard();
        }

        /**
         * FILTERS & STATS
         */

        function setupEventListeners() {
            document.getElementById('searchBar').addEventListener('input', applyFilters);
            document.getElementById('priorityFilter').addEventListener('change', applyFilters);
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchBar').value.toLowerCase();
            const priorityTerm = document.getElementById('priorityFilter').value;

            document.querySelectorAll('.card').forEach(cardEl => {
                const cardId = cardEl.dataset.id;
                // Find card in state
                let foundCard = null;
                state.columns.forEach(col => {
                    const c = col.cards.find(card => card.id === cardId);
                    if (c) foundCard = c;
                });

                if (!foundCard) return;

                const matchesSearch = foundCard.title.toLowerCase().includes(searchTerm);
                const matchesPriority = priorityTerm === 'All' || foundCard.priority === priorityTerm;

                if (matchesSearch && matchesPriority) {
                    cardEl.classList.remove('hidden');
                } else {
                    cardEl.classList.add('hidden');
                }
            });
        }

        function updateStats() {
            let total = 0;
            let overdue = 0;
            let done = 0;

            state.columns.forEach(col => {
                col.cards.forEach(card => {
                    total++;
                    if (card.done) {
                        done++;
                    } else if (card.dueDate) {
                        // Normalizing time to compare dates
                        const today = new Date();
                        today.setHours(0,0,0,0);
                        const dueDate = new Date(card.dueDate);
                        if (dueDate < today) overdue++;
                    }
                });
            });

            const rate = total === 0 ? 0 : Math.round((done / total) * 100);

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statOverdue').innerText = overdue;
            document.getElementById('statDone').innerText = done;
            document.getElementById('statRate').innerText = `${rate}%`;
        }

        // Start the application
        init();

    </script>
</body>
</html>
