<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SECTION: CSS — Dark Theme, Glassmorphism, Animations
    ============================================================ */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: #0f1117;
  color: #e0e0e0;
  display: flex;
  flex-direction: column;
}

/* Scrollbar */
::-webkit-scrollbar { height: 6px; width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2c3d; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3b3d55; }

/* ---------- Header ---------- */
.app-header {
  flex-shrink: 0;
  padding: 16px 28px 12px;
  background: linear-gradient(180deg, #141620 0%, #0f1117 100%);
  border-bottom: 1px solid #1e2030;
  z-index: 10;
}

.app-header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  color: #f0f0f5;
  margin-bottom: 10px;
  letter-spacing: -0.02em;
}

.header-controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.search-input {
  flex: 1;
  min-width: 180px;
  max-width: 360px;
  padding: 7px 12px;
  border: 1px solid #2a2c3d;
  border-radius: 8px;
  background: #181a25;
  color: #e0e0e0;
  font-family: inherit;
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: #6c72cb; }
.search-input::placeholder { color: #555; }

.filter-select {
  padding: 7px 12px;
  border: 1px solid #2a2c3d;
  border-radius: 8px;
  background: #181a25;
  color: #e0e0e0;
  font-family: inherit;
  font-size: 0.85rem;
  outline: none;
  cursor: pointer;
}

/* ---------- Board Area ---------- */
.board-wrapper {
  flex: 1;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 24px;
  display: flex;
  align-items: flex-start;
}

.board-inner {
  display: flex;
  gap: 18px;
  align-items: flex-start;
  min-height: 0;
}

/* ---------- Column (Glassmorphism) ---------- */
.column {
  width: 300px;
  min-width: 300px;
  height: fit-content;
  max-height: calc(100vh - 160px);
  display: flex;
  flex-direction: column;
  background: rgba(26, 28, 42, 0.65);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(59, 61, 85, 0.45);
  border-radius: 14px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.04);
  position: relative;
  transition: box-shadow 0.3s, transform 0.3s;
}

.column:hover {
  box-shadow: 0 6px 28px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
}

/* Drop-zone highlight */
.column.drag-over {
  box-shadow: 0 0 0 2px #6c72cb, 0 8px 36px rgba(108,114,203,0.22), inset 0 1px 0 rgba(255,255,255,0.08);
  transform: scale(1.01);
  animation: pulseColumn 1.5s ease-in-out infinite;
}

@keyframes pulseColumn {
  0%, 100% { box-shadow: 0 0 0 2px #6c72cb, 0 8px 36px rgba(108,114,203,0.18), inset 0 1px 0 rgba(255,255,255,0.06); }
  50% { box-shadow: 0 0 0 3px #8b92e8, 0 10px 40px rgba(108,114,203,0.32), inset 0 1px 0 rgba(255,255,255,0.1); }
}

/* ---------- Column Header ---------- */
.column-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px 8px;
  user-select: none;
  border-bottom: 1px solid rgba(59,61,85,0.35);
}

.column-title-display {
  flex: 1;
  font-size: 0.88rem;
  font-weight: 600;
  color: #d0d2e0;
  cursor: pointer;
  transition: color 0.2s;
}
.column-title-display:hover { color: #f0f0f5; }

.column-header-edit {
  flex: 1;
  background: #1e2030;
  border: 1px solid #6c72cb;
  border-radius: 6px;
  color: #e0e0e0;
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 600;
  padding: 3px 8px;
  outline: none;
}

.column-header-actions {
  display: flex;
  gap: 3px;
  opacity: 0;
  transition: opacity 0.2s;
}
.column-header-actions .icon-btn { display: none; }
.column:hover .column-header-actions .trash-btn { display: flex; }
.column:hover .column-header-actions { opacity: 1; }

.icon-btn {
  background: rgba(59,61,85,0.35);
  border: none;
  color: #a0a2b8;
  width: 26px;
  height: 26px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  transition: background 0.15s, color 0.15s;
}
.icon-btn:hover { background: rgba(80,82,110,0.55); color: #e0e0e0; }
.icon-btn.trash-btn:hover { background: rgba(180,60,60,0.45); color: #ff6b6b; }

/* ---------- Cards Container ---------- */
.column-cards {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 50px;
}

/* Drop indicator line */
.drop-indicator {
  height: 3px;
  background: #6c72cb;
  border-radius: 3px;
  margin: -1px 0;
  box-shadow: 0 0 8px rgba(108,114,203,0.55);
  flex-shrink: 0;
}

/* ---------- Card ---------- */
.card {
  background: rgba(30, 32, 48, 0.75);
  border: 1px solid rgba(59,61,85,0.45);
  border-radius: 10px;
  padding: 12px 12px 10px;
  cursor: grab;
  transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.25s ease;
  position: relative;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 16px rgba(0,0,0,0.3);
}
.card:active { cursor: grabbing; }

.dragging-card {
  opacity: 0.35;
  transform: scale(0.96);
}

/* Card delete button */
.card-delete {
  position: absolute;
  top: 6px;
  right: 6px;
  background: rgba(160,50,50,0.5);
  border: none;
  color: #ff8888;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.8rem;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.18s;
}
.card:hover .card-delete { opacity: 1; }
.card-delete:hover { background: rgba(200,60,60,0.6); color: #ffaaaa; }

/* Card edit button */
.card-edit {
  position: absolute;
  bottom: 6px;
  right: 6px;
  background: rgba(108,114,203,0.35);
  border: none;
  color: #b0b4e0;
  width: 20px;
  height: 20px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.72rem;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.18s;
}
.card:hover .card-edit { opacity: 1; }
.card-edit:hover { background: rgba(108,114,203,0.5); color: #d0d4f0; }

.card-meta-edit {
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* Card title */
.card-title {
  font-size: 0.85rem;
  font-weight: 600;
  color: #d8d9e4;
  word-break: break-word;
  line-height: 1.35;
}

/* Done column overrides */
.column[data-column-id="done"] .card-title {
  color: #6b6d82 !important;
  text-decoration: line-through !important;
}

/* Card description */
.card-description {
  font-size: 0.78rem;
  color: #888aa0;
  margin-top: 8px;
  word-break: break-word;
  display: none;
}
.card-description.visible { display: block; }

.card-toggle-desc {
  font-size: 0.72rem;
  color: #6c72cb;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0 0 6px;
  font-family: inherit;
  font-weight: 500;
}
.card-toggle-desc:hover { text-decoration: underline; color: #8b92e8; }

/* Card meta row */
.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}

/* Priority badge */
.priority-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 9px;
  border-radius: 18px;
  font-size: 0.66rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.priority-badge.low     { background: rgba(30,130,75,0.14); color: #4ad98a; border: 1px solid rgba(30,130,75,0.22); }
.priority-badge.medium  { background: rgba(200,140,30,0.12); color: #f0b830; border: 1px solid rgba(200,140,30,0.22); }
.priority-badge.high    { background: rgba(180,50,50,0.18);  color: #e8685e; border: 1px solid rgba(180,50,50,0.28); }

/* Due date */
.card-due {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.7rem;
  color: #888aa0;
  background: rgba(30,32,48,0.5);
  padding: 2px 7px;
  border-radius: 5px;
}
.card-due.overdue { color: #e04848; }
.card-due.overdue::before { content: '⚠️'; }

/* Filter-hidden placeholder */
.card-filter-hidden { opacity: 0.2; pointer-events: none; }

/* ---------- Add Card Button ---------- */
.add-card-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 9px;
  margin: 4px 10px 10px;
  background: rgba(30,32,48,0.4);
  border: 1px dashed rgba(59,61,85,0.4);
  border-radius: 8px;
  color: #707290;
  font-family: inherit;
  font-size: 0.8rem;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.add-card-btn:hover { background: rgba(40,42,60,0.5); color: #a0a2cc; }

/* ---------- Inline Forms (Cards & Columns) ---------- */
.add-card-form,
.add-column-form,
.edit-card-form {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  background: rgba(22, 24, 38, 0.95);
  border: 1px solid rgba(108, 114, 203, 0.35);
  border-radius: 8px;
}

.add-card-form input,
.add-card-form select,
.add-card-form textarea,
.add-column-form input,
.edit-card-form input,
.edit-card-form select,
.edit-card-form textarea {
  width: 100%;
  padding: 7px 9px;
  border: 1px solid #2a2c3d;
  border-radius: 7px;
  background: #181a25;
  color: #e0e0e0;
  font-family: inherit;
  font-size: 0.82rem;
  outline: none;
  transition: border-color 0.2s;
}
.add-card-form input:focus,
.add-card-form select:focus,
.add-card-form textarea:focus,
.add-column-form input:focus,
.edit-card-form input:focus,
.edit-card-form select:focus,
.edit-card-form textarea:focus { border-color: #6c72cb; }
.add-card-form textarea,
.edit-card-form textarea { resize: vertical; min-height: 55px; }
.add-card-form select,
.edit-card-form select { cursor: pointer; }
.add-card-form select option,
.edit-card-form select option { background: #181a25; }

.form-actions {
  display: flex;
  gap: 7px;
  justify-content: flex-end;
  margin-top: 2px;
}

.form-btn-save {
  padding: 6px 15px;
  border: none;
  border-radius: 7px;
  background: #6c72cb;
  color: #fff;
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.form-btn-save:hover { background: #7e84d4; }

.form-btn-cancel {
  padding: 6px 12px;
  border: 1px solid #2a2c3d;
  border-radius: 7px;
  background: transparent;
  color: #707290;
  font-family: inherit;
  font-size: 0.8rem;
  cursor: pointer;
  transition: color 0.2s;
}
.form-btn-cancel:hover { color: #c0c2d8; }

/* ---------- Add Column Button (outside columns) ---------- */
.add-column-btn-board {
  flex-shrink: 0;
  width: 260px;
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(26,28,42,0.35);
  border: 2px dashed rgba(59,61,85,0.35);
  border-radius: 12px;
  color: #5a5c72;
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.add-column-btn-board:hover { background: rgba(40,42,60,0.45); color: #a0a2cc; }

/* ---------- Statistics Bar ---------- */
.stats-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 48px;
  flex-shrink: 0;
  background: rgba(15,17,23,0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid #1e2030;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 36px;
  z-index: 200;
}

.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}
.stat-label {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #4a4c62;
  font-weight: 600;
}
.stat-value {
  font-size: 1rem;
  font-weight: 700;
  color: #d0d2e0;
}
.stat-value.overdue { color: #e8685e; }

/* ---------- Responsive ---------- */
@media (max-width: 640px) {
  .app-header { padding: 12px 14px 10px; }
  .app-header h1 { font-size: 1.15rem; }
  .header-controls { flex-direction: column; gap: 8px; }
  .search-input { max-width: 100%; }
  .column { width: 260px; min-width: 260px; }
  .stats-bar { gap: 14px; }
  .stat-label { font-size: 0.55rem; }
}
</style>
</head>
<body>

<!-- ================================================================= -->
<!-- HTML Structure                                                      -->
<!-- ================================================================= -->

<header class="app-header">
  <h1>📋 Kanban Board</h1>
  <div class="header-controls">
    <input type="text" id="searchInput" class="search-input" placeholder="Search cards…">
    <select id="priorityFilter" class="filter-select">
      <option value="all">All Priorities</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
  </div>
</header>

<div class="board-wrapper">
  <div class="board-inner" id="boardInner">
    <button class="add-column-btn-board" id="addColumnBoardBtn">＋ Add Column</button>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-item">
    <span class="stat-label">Total Cards</span>
    <span class="stat-value" id="statTotal">0</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">Overdue</span>
    <span class="stat-value overdue" id="statOverdue">0</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">Done</span>
    <span class="stat-value" id="statDone">0</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">Completion</span>
    <span class="stat-value" id="statCompletion">0%</span>
  </div>
</div>

<!-- ================================================================= -->
<!-- JavaScript                                                          -->
<!-- ================================================================= -->
<script>
/* ============================================================
   SECTION 1: STATE — Board data model
    ============================================================ */

const STORAGE_KEY = 'kanban-board-state';

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function pastDate(daysAgo) {
  const d = new Date(); d.setDate(d.getDate() - daysAgo);
  return d.toISOString().slice(0, 10);
}
function futureDate(daysFromNow) {
  const d = new Date(); d.setDate(d.getDate() + daysFromNow);
  return d.toISOString().slice(0, 10);
}

// Default columns
const DEF_COLUMNS = [
  { id: '__backlog__',   title: 'Backlog',   cards: [] },
  { id: '__todo__',      title: 'To Do',     cards: [] },
  { id: '__inprogress__', title: 'In Progress', cards: [] },
  { id: '__done__',      title: 'Done',      cards: [] },
];

// Example cards
const EX_CARDS = [
  { id: uid(), title: 'Research project requirements', description: 'Read through the brief and gather all documents.', priority: 'medium', dueDate: '', columnId: '__backlog__' },
  { id: uid(), title: 'Set up CI/CD pipeline', description: 'Configure automated build & deploy.', priority: 'high', dueDate: pastDate(1), columnId: '__backlog__' },
  { id: uid(), title: 'Design UI mockups', description: 'Figma files for the landing page.', priority: 'medium', dueDate: '', columnId: '__todo__' },
  { id: uid(), title: 'Write unit tests', description: '', priority: 'low', dueDate: '', columnId: '__todo__' },
  { id: uid(), title: 'Implement auth flow', description: 'OAuth2 + refresh tokens.', priority: 'high', dueDate: futureDate(3), columnId: '__inprogress__' },
  { id: uid(), title: 'Fix pagination bug', description: '', priority: 'medium', dueDate: '', columnId: '__inprogress__' },
  { id: uid(), title: 'Review PR #42', description: 'Check the migration script.', priority: 'low', dueDate: '', columnId: '__done__' },
];

let state;

/** Load from localStorage or create initial state */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state = JSON.parse(raw);
      // Ensure default columns exist
      const ids = new Set(state.columns.map(c => c.id));
      DEF_COLUMNS.forEach(def => {
        if (!ids.has(def.id)) state.columns.push({ ...def });
      });
    } else {
      state = { columns: JSON.parse(JSON.stringify(DEF_COLUMNS)) };
      // Attach example cards
      EX_CARDS.forEach(c => {
        const col = state.columns.find(x => x.id === c.columnId);
        if (col) col.cards.push({ ...c });
      });
    }
  } catch (e) {
    console.error('Load error:', e);
    state = { columns: JSON.parse(JSON.stringify(DEF_COLUMNS)) };
    EX_CARDS.forEach(c => {
      const col = state.columns.find(x => x.id === c.columnId);
      if (col) col.cards.push({ ...c });
    });
  }
}

/** Persist to localStorage */
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('Save error:', e);
  }
}

/** Flat list of all cards */
function allCards() {
  return state.columns.flatMap(c => c.cards);
}

/* ============================================================
   SECTION 2: RENDERING — Build full DOM from state
    ============================================================ */

const boardInner = document.getElementById('boardInner');
const addColBtn  = document.getElementById('addColumnBoardBtn');

const today = new Date().toISOString().slice(0, 10);

function renderBoard() {
  // Remove all existing columns (keep addColumnBoardBtn)
  boardInner.querySelectorAll('.column').forEach(el => el.remove());

  state.columns.forEach(col => {
    boardInner.insertBefore(createColumn(col), addColBtn);
  });
  reapplyFilters();
}

/** Create a column element (+ cards, add-card btn, events) */
function createColumn(col) {
  const colEl = document.createElement('div');
  colEl.className = 'column';
  colEl.dataset.columnId = col.id;

  // --- Header ---
  const headerEl = document.createElement('div');
  headerEl.className = 'column-header';

  const titleEl = document.createElement('div');
  titleEl.className = 'column-title-display';
  titleEl.textContent = col.title;
  headerEl.appendChild(titleEl);

  // Header actions
  const actionsEl = document.createElement('div');
  actionsEl.className = 'column-header-actions';

  // Rename (double-click on title)
  titleEl.addEventListener('dblclick', () => startRename(col, colEl, titleEl));
   // Trash (only if empty)
  const trashBtn = document.createElement('button');
  trashBtn.className = 'icon-btn';
  trashBtn.innerHTML = '&#x2715;';
  trashBtn.title = 'Delete column';
  if (col.cards.length === 0) {
    trashBtn.classList.add('trash-btn');
    trashBtn.addEventListener('click', () => {
      if (confirm('Delete column "' + col.title + '"?')) {
        state.columns = state.columns.filter(c => c.id !== col.id);
        saveState(); renderBoard(); updateStats();
       }
     });
    } else {
    trashBtn.title = 'Column is not empty';
    }
   headerEl.style.cssText = "position:relative";
  actionsEl.appendChild(trashBtn);
  headerEl.appendChild(actionsEl);

  // --- Cards container ---
  const cardsEl = document.createElement('div');
  cardsEl.className = 'column-cards';
  cardsEl.dataset.columnId = col.id;

  col.cards.forEach(card => {
    cardsEl.appendChild(createCard(card, col.id));
  });
  colEl.appendChild(cardsEl);

  // --- "＋ Add Card" button (appended to this column) ---
  const addBtn = document.createElement('button');
  addBtn.className = 'add-card-btn';
  addBtn.innerHTML = '<span>＋</span> Add card';
  addBtn.addEventListener('click', () => openCardForm(col, null, colEl, cardsEl, addBtn));
  colEl.appendChild(addBtn);

  // --- Drag & Drop for column ---
  colEl.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    colEl.classList.add('drag-over');
    // Position indicator
    positionIndicator(colEl, cardsEl, e.clientY);
  });

  colEl.addEventListener('dragleave', (e) => {
    if (!colEl.contains(e.relatedTarget)) {
      colEl.classList.remove('drag-over');
      colEl.querySelectorAll('.drop-indicator').forEach(el => el.remove());
    }
  });

  colEl.addEventListener('drop', (e) => {
    e.preventDefault();
    colEl.classList.remove('drag-over');
    colEl.querySelectorAll('.drop-indicator').forEach(el => el.remove());

    const cardId     = e.dataTransfer.getData('text/plain');
    const fromColId  = e.dataTransfer.getData('board.fromCol');

    if (!cardId || !fromColId) return;

    // Find & remove card from source column
    let card = null, fromCol = null;
    for (const c of state.columns) {
      const idx = c.cards.findIndex(x => x.id === cardId);
      if (idx !== -1) { card = c.cards.splice(idx, 1)[0]; fromCol = c; break; }
    }
    if (!card) return;

    // Determine insertion index
    const idx = insertionIndex(cardsEl, e.clientY);

    // Apply card
    card.columnId = col.id;
    col.cards.splice(idx, 0, card);

    saveState(); renderBoard(); updateStats();
  });

  return colEl;
}

/** Create a card element */
function createCard(card, columnId) {
  const el = document.createElement('div');
  el.className = 'card';
   // Find column from state
  const col = state.columns.find(c => c.id === columnId);
  el.draggable = true;
  el.dataset.cardId = card.id;

  el.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', card.id);
    e.dataTransfer.setData('board.fromCol', columnId);
    e.dataTransfer.effectAllowed = 'move';
    requestAnimationFrame(() => el.classList.add('dragging-card'));
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging-card'));
	// Double-click to edit
  el.addEventListener('dblclick', (e) => {
    e.preventDefault();
    openCardForm(col, card, null, null, el);
  });

  // Title
  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = card.title;
  el.appendChild(title);

  // Description (collapsible)
  if (card.description && card.description.trim()) {
    const descEl = document.createElement('div');
    descEl.className = 'card-description';
    descEl.textContent = card.description;

    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'card-toggle-desc';
    toggleBtn.textContent = 'Show details';
    toggleBtn.addEventListener('click', () => {
      const vis = descEl.classList.toggle('visible');
      toggleBtn.textContent = vis ? 'Hide details' : 'Show details';
    });

    el.appendChild(descEl);
    el.appendChild(toggleBtn);
  }

  // Meta row: priority + due date
  const meta = document.createElement('div');
  meta.className = 'card-meta';

  // Priority badge
  const badge = document.createElement('span');
  badge.className = 'priority-badge ' + (card.priority || 'low');
  badge.textContent = (card.priority || 'low').charAt(0).toUpperCase() + (card.priority || 'low').slice(1);
  meta.appendChild(badge);

  // Due date
  if (card.dueDate) {
    const due = document.createElement('span');
    due.className = 'card-due' + (card.dueDate < today ? ' overdue' : '');
    due.textContent = card.dueDate < today ? '⚠️ ' : '';
    due.textContent += formatDate(card.dueDate);
    meta.appendChild(due);
  }
  el.appendChild(meta);

  // Delete button
  const delBtn = document.createElement('button');
  delBtn.className = 'card-delete';
  delBtn.innerHTML = '&#x2715;';
  delBtn.title = 'Delete card';
  delBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    el.classList.add('dragging-card'); // re-use fade
    el.style.opacity = '0';
    el.style.transform = 'translateY(-10px) scale(0.95)';
    setTimeout(() => {
      const col = state.columns.find(c => c.id === columnId);
      if (col) col.cards = col.cards.filter(x => x.id !== card.id);
      saveState(); renderBoard(); updateStats();
    }, 200);
  });
  el.appendChild(delBtn);

    // Edit button
  const editBtn = document.createElement('button');
  editBtn.className = 'card-edit';
  editBtn.innerHTML = '&#x270E;';
  editBtn.title = 'Edit card';
  editBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    e.preventDefault();
    openCardForm(col, card, null, null, el);
   });
  el.appendChild(editBtn);

  return el;
}

/** Nice date formatting */
function formatDate(str) {
  if (!str) return '';
  const [y, m, d] = str.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(m) - 1] + ' ' + parseInt(d) + ', ' + y;
}

/* ============================================================
   SECTION 3: DRAG — Position indicator within column
    ============================================================ */

/** Calculate card index at a given Y position */
function insertionIndex(cardsEl, mouseY) {
  const items = [...cardsEl.querySelectorAll('.card:not(.dragging-card):not(.card-filter-hidden)')];
  // Try to find a gap before which to insert
  for (let i = 0; i < items.length; i++) {
    const rect = items[i].getBoundingClientRect();
    if (mouseY < rect.top + rect.height / 2) return i;
  }
  return items.length;
}

/** Render the thin drop-indicator line near the right position */
function positionIndicator(colEl, cardsEl, mouseY) {
  colEl.querySelectorAll('.drop-indicator').forEach(el => el.remove());

  const items = [...cardsEl.querySelectorAll('.card:not(.dragging-card)')];
  let idx = items.length;
  for (let i = 0; i < items.length; i++) {
    const rect = items[i].getBoundingClientRect();
    if (mouseY < rect.top + rect.height / 2) { idx = i; break; }
  }

  const ind = document.createElement('div');
  ind.className = 'drop-indicator';
  if (idx < items.length) {
    cardsEl.insertBefore(ind, items[idx]);
  } else {
    cardsEl.appendChild(ind);
  }
}

/* ============================================================
   SECTION 4: INLINE CARD FORM  — Add card inside a column
    ============================================================ */

function openCardForm(col, cardObj, colEl, cardsEl, addBtnOrCardEl) {
  const isEdit = cardObj !== null;

  // Create form elements
  const form = document.createElement('div');
  form.className = isEdit ? 'edit-card-form' : 'add-card-form';
  if (isEdit) form.style.padding = '10px';

  const titleInput = document.createElement('input');
  titleInput.type = 'text';
  titleInput.placeholder = 'Card title *';
  titleInput.autocomplete = 'off';
  titleInput.value = isEdit ? cardObj.title : '';
  titleInput.style.width = '100%';
  titleInput.style.padding = '7px 9px';
  titleInput.style.border = '1px solid #2a2c3d';
  titleInput.style.borderRadius = '7px';
  titleInput.style.background = '#181a25';
  titleInput.style.color = '#e0e0e0';
  titleInput.style.fontFamily = 'inherit';
  titleInput.style.fontSize = '0.82rem';
  titleInput.style.outline = 'none';
  titleInput.style.transition = 'border-color 0.2s';

  const prioritySelect = document.createElement('select');
  prioritySelect.innerHTML = '<option value="low"' + (isEdit && cardObj.priority === 'low' ? ' selected' : (isEdit ? '' : ' selected')) + '>Low</option><option value="medium"' + (isEdit && cardObj.priority === 'medium' ? ' selected' : '') + '>Medium</option><option value="high"' + (isEdit && cardObj.priority === 'high' ? ' selected' : '') + '>High</option>';
  prioritySelect.style.width = '100%';
  prioritySelect.style.padding = '7px 9px';
  prioritySelect.style.border = '1px solid #2a2c3d';
  prioritySelect.style.borderRadius = '7px';
  prioritySelect.style.background = '#181a25';
  prioritySelect.style.color = '#e0e0e0';
  prioritySelect.style.fontFamily = 'inherit';
  prioritySelect.style.fontSize = '0.82rem';
  prioritySelect.style.outline = 'none';
  prioritySelect.style.cursor = 'pointer';

  const dueInput = document.createElement('input');
  dueInput.type = 'date';
  dueInput.value = isEdit ? (cardObj.dueDate || '') : '';
  dueInput.style.width = '100%';
  dueInput.style.padding = '7px 9px';
  dueInput.style.border = '1px solid #2a2c3d';
  dueInput.style.borderRadius = '7px';
  dueInput.style.background = '#181a25';
  dueInput.style.color = '#e0e0e0';
  dueInput.style.fontFamily = 'inherit';
  dueInput.style.fontSize = '0.82rem';
  dueInput.style.outline = 'none';

  const descTextarea = document.createElement('textarea');
  descTextarea.placeholder = 'Description (optional)';
  descTextarea.value = isEdit ? (cardObj.description || '') : '';
  descTextarea.style.width = '100%';
  descTextarea.style.padding = '7px 9px';
  descTextarea.style.border = '1px solid #2a2c3d';
  descTextarea.style.borderRadius = '7px';
  descTextarea.style.background = '#181a25';
  descTextarea.style.color = '#e0e0e0';
  descTextarea.style.fontFamily = 'inherit';
  descTextarea.style.fontSize = '0.82rem';
  descTextarea.style.outline = 'none';
  descTextarea.style.resize = 'vertical';
  descTextarea.style.minHeight = '55px';

  const actionsDiv = document.createElement('div');
  actionsDiv.style.display = 'flex';
  actionsDiv.style.gap = '7px';
  actionsDiv.style.justifyContent = 'flex-end';
  actionsDiv.style.marginTop = '2px';

  const saveBtn = document.createElement('button');
  saveBtn.className = 'form-btn-save';
  saveBtn.textContent = 'Save';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'form-btn-cancel';
  cancelBtn.textContent = 'Cancel';

  // Save handler
  saveBtn.addEventListener('click', () => {
    const title = titleInput.value.trim();
    if (!title) {
      titleInput.style.borderColor = '#e8685e';
      return;
    }
    if (isEdit) {
      // Update existing card
      cardObj.title = title;
      cardObj.priority = prioritySelect.value;
      cardObj.dueDate = dueInput.value;
      cardObj.description = descTextarea.value.trim();
    } else {
      // Create new card
      const card = {
        id: uid(),
        title,
        priority: prioritySelect.value,
        dueDate: dueInput.value,
        description: descTextarea.value.trim(),
        columnId: col.id,
      };
      col.cards.push(card);
    }
    saveState();
    renderBoard();
    updateStats();
  });

  // Cancel handler
  cancelBtn.addEventListener('click', () => {
    if (isEdit) {
      // Revert: re-render the card
      saveState();
      renderBoard();
    } else {
      renderBoard();
    }
  });

  actionsDiv.appendChild(cancelBtn);
  actionsDiv.appendChild(saveBtn);

  form.appendChild(titleInput);
  form.appendChild(prioritySelect);
  form.appendChild(dueInput);
  form.appendChild(descTextarea);
  form.appendChild(actionsDiv);

  // Setup UI based on mode
  if (isEdit) {
    // Replace card content with form
    const cardEl = addBtnOrCardEl;
    cardEl.innerHTML = '';
    cardEl.appendChild(form);
    titleInput.focus();
    cardEl.style.pointerEvents = 'none'; // prevent dragging while editing
    cardEl.addEventListener('dblclick', () => {}); // prevent drag events

    // Allow clicking on the form content but not on card itself to drag
    form.addEventListener('mousedown', (e) => e.stopPropagation());
  } else {
    // Add mode: replace the add button with form
    addBtnOrCardEl.remove(); // this is the add button
    cardsEl.appendChild(form);
    titleInput.focus();
  }

  // Keyboard shortcuts
  const keyHandler = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      saveBtn.click();
    }
    if (e.key === 'Escape') cancelBtn.click();
  };
  titleInput.addEventListener('keydown', keyHandler);
  descTextarea.addEventListener('keydown', keyHandler);
}



/* ============================================================
   SECTION 5: COLUMN MANAGEMENT — Rename & Add
    ============================================================ */

/** Double-click rename */
function startRename(col, colEl, titleEl) {
  const input = document.createElement('input');
  input.className = 'column-header-edit';
  input.value = col.title;

  titleEl.replaceWith(input);
  input.focus(); input.select();

  function commit() {
    const newTitle = input.value.trim();
    if (newTitle && newTitle !== col.title) col.title = newTitle;
    // Re-render to restore title
    saveState(); renderBoard();
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = col.title; input.blur(); }
  });
}

/** "＋ Add Column" button */
addColBtn.addEventListener('click', () => {
  addColBtn.remove();

  const form = document.createElement('div');
  form.className = 'column';
  form.style.opacity = '0';
  form.innerHTML = `
    <div class="add-column-form">
      <input id="_acf-title" type="text" placeholder="New column name" autofocus>
      <div class="form-actions">
        <button id="_acf-cancel" class="form-btn-cancel">Cancel</button>
        <button id="_acf-save" class="form-btn-save">Add</button>
      </div>
    </div>`;

  form.querySelector('#_acf-save').addEventListener('click', () => {
    const title = form.querySelector('#_acf-title').value.trim();
    if (!title) return;
    state.columns.push({ id: '__' + uid(), title, cards: [] });
    saveState(); renderBoard();
  });

  form.querySelector('#_acf-cancel').addEventListener('click', () => {
    renderBoard();
  });

  form.querySelector('#_acf-title').addEventListener('keydown', e => {
    if (e.key === 'Enter') form.querySelector('#_acf-save').click();
    if (e.key === 'Escape') renderBoard();
  });

  form.querySelector('#_acf-title').focus();
  boardInner.insertBefore(form, addColBtn);
  addColBtn.style.display = 'none';

  // Show add button again when done
  function showBtn() { addColBtn.style.display = ''; boardInner.appendChild(addColBtn); }
  form.querySelector('#_acf-save').addEventListener('click', showBtn);
  form.querySelector('#_acf-cancel').addEventListener('click', showBtn);
});

/* ============================================================
   SECTION 6: FILTERS — Search & Priority dropdown
    ============================================================ */

function reapplyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const pf = document.getElementById('priorityFilter').value;

  allCards().forEach(card => {
    const el = document.querySelector(`.card[data-card-id="${card.id}"]`);
    if (!el) return;
    const m1 = !q || card.title.toLowerCase().includes(q);
    const m2 = pf === 'all' || (card.priority || 'low') === pf;
    el.style.display = 'block';
    if (m1 && m2) {
      el.style.opacity = '';
      el.classList.remove('card-filter-hidden');
    } else {
      el.classList.add('card-filter-hidden');
    }
  });
  // Update stats after filter (counts all regardless)
  // updateStats is called on render already
}

document.getElementById('searchInput').addEventListener('input', reapplyFilters);
document.getElementById('priorityFilter').addEventListener('change', reapplyFilters);

/* ============================================================
   SECTION 7: STATISTICS
    ============================================================ */

function updateStats() {
  const cards = allCards();
  const total = cards.length;
  const overdue = cards.filter(c => c.dueDate && c.dueDate < today).length;
  const doneCol = state.columns.find(c => c.id === '__done__');
  const done = doneCol ? doneCol.cards.length : 0;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statOverdue').textContent = overdue;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statCompletion').textContent = pct + '%';
}

/* ============================================================
   SECTION 8: INIT
    ============================================================ */

loadState();
renderBoard();
updateStats();
</script>
